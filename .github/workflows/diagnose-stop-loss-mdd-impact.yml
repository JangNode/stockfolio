name: (Temp) Diagnose stop-loss MDD impact

# 디스포저블 분석 워크플로 — ma_cross/minervini_trend_template/peg_lynch에 손절선을
# 시뮬레이션으로 적용했을 때 MDD/CAGR/승률 변화를 확인한다. 결과 확인 후 정리 PR로
# 스크립트와 함께 제거 예정(코드 변경 없는 순수 분석).
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose stop-loss MDD impact
        run: npm run diagnose:stop-loss-mdd-impact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
