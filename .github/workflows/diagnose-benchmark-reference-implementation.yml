          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check Parquet cache changes
        id: parquet_cache_state
        if: ${{ always() }}
        run: |
          if [ -f .parquet-cache/.dirty ]; then echo "dirty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Parquet cache
        if: ${{ always() && steps.parquet_cache_state.outputs.dirty == 'true' && inputs.which != 'ds6fwd' && inputs.which != 'ds89' && inputs.which != 'ds6reg' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save 고정 스냅샷 (parquet-snapshot-20261026, 점검 통과 시에만; 이미 있으면 저장 실패는 무시)
        if: ${{ steps.snap_check.conclusion == 'success' && inputs.which == 'snap' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-snapshot-20261026

  # 연구 DS6 포워드 로그 커밋: ds6-forward-log.csv 한 파일만, 연구 브랜치에서 실행했을 때만 같은 브랜치에 커밋한다(main 아님, PR 없음). 실패해도 아티팩트(ds6-forward-log)에 로그가 남는다.
  commit-ds6-forward-log:
    needs: run
    if: ${{ inputs.which == 'ds6fwd' && needs.run.result == 'success' && github.ref == 'refs/heads/claude/ma-v3-portfolio-cap-run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 연구 브랜치
        uses: actions/checkout@v4
        with:
          ref: claude/ma-v3-portfolio-cap-run

      - name: 로그 아티팩트 받기
        uses: actions/download-artifact@v4
        with:
          name: ds6-forward-log
          path: .ds6fwd-artifact

      - name: ds6-forward-log.csv만 커밋·푸시
        run: |
          set -e
          cp .ds6fwd-artifact/ds6-forward-log.csv docs/research/ds6-forward-log.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/ds6-forward-log.csv
          if git diff --cached --quiet; then echo "로그 변경 없음 — 커밋하지 않음"; exit 0; fi
          git diff --cached --stat
          rows=$(($(wc -l < docs/research/ds6-forward-log.csv) - 1))
          git commit -m "연구 DS6 포워드 관찰: 로그 갱신(${rows}거래일, 워크플로 실행 ${GITHUB_RUN_ID})"
          for i in 1 2 3; do
            git pull --rebase origin claude/ma-v3-portfolio-cap-run && git push origin HEAD:claude/ma-v3-portfolio-cap-run && exit 0
            sleep $((i * 3))
          done
          echo "::error::푸시 실패 — 아티팩트 ds6-forward-log를 받아 연구 브랜치에 커밋해야 합니다"
          exit 1
