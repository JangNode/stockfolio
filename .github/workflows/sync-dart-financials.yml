name: Sync DART Financials and Dividends

on:
  schedule:
    # 매주 월요일 한국시간(KST, UTC+9) 오전 5시 30분 = UTC 전주 일요일 20시 30분.
    # corp_code 매핑 동기화(sync-dart-corp-codes.yml, 월 05:00 KST)가 끝난 뒤에 돌아야
    # 매핑이 최신인 상태에서 대형주를 걸러낼 수 있어 30분 뒤로 잡았다. KIS 일일 스크리닝
    # 배치(screening.yml)와는 완전히 별개 — 훨씬 낮은 주기(주 1회)로 돈다.
    - cron: "30 20 * * 0"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # 전종목 시가총액 조회(KIS) + 대형주 재무제표/배당 이력 조회(DART)를 합쳐도 대형주
    # 규모(수백 개)를 감안하면 넉넉한 상한.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync DART financials and dividends for large-cap stocks
        run: npm run sync:dart-financials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
