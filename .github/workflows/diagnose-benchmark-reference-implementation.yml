          FWD_PHASE: verify
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 DS6 포워드 2단계 관찰 (KST 14:00~15:40 금지, 캐시 적중이면 2026 파일만 받음, 069500 신규 거래일만 KRX, DART 호출 0, DB 쓰기 0)
        id: ds6fwd_run
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'ds6fwd' }}
        run: npx tsx --conditions=react-server scripts/research-ds6-forward.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          FWD_PHASE: forward
          BENCH_AUX_069500: "1"
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: DS6 포워드 로그 업로드 (커밋 작업과 보관용; ds6-forward-log.csv 한 파일)
        if: ${{ steps.ds6fwd_run.conclusion == 'success' && inputs.which == 'ds6fwd' }}
        uses: actions/upload-artifact@v4
        with:
          name: ds6-forward-log
          path: docs/research/ds6-forward-log.csv
          retention-days: 90

      - name: 연구 진단 MDD 해부 (시험 아님, 읽기 전용, 고정 스냅샷, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'mdd' }}
        run: npx tsx --conditions=react-server scripts/diagnose-mdd-anatomy.ts
        env:
