name: 실험조합형 콜드스타트 상태 확인 (진단, 1회성)

# 실험조합형(experimental_blend) KR 계좌의 콜드스타트 17건 매수를 되돌리기
# 전, 실제 DB 상태(현금/거래/포지션/스냅샷)를 확인한다. 순수 조회(쓰기
# 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-experimental-blend-cold-start.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose experimental_blend cold start
        run: npm run diagnose:experimental-blend-cold-start
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
