name: Stock Screening Batch

on:
  schedule:
    # 평일 한국시간(KST, UTC+9) 오후 2시 30분 = UTC 05:30. 이 시점에 수집한 가격
    # 기준으로 판단하는 게 의도된 동작이라, 당일 미확정 종가를 쓰더라도 그대로 둔다.
    # cron의 요일 필드는 UTC 기준이지만 KST 14:30 - 9h = UTC 05:30로 날짜가 안 바뀌므로
    # 평일(월~금, 1-5) 그대로 대응된다.
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}

jobs:
  screen:
    runs-on: ubuntu-latest
    # lib/kis.ts의 우선순위 토큰버킷(배치 초당 12건 + 병렬 처리) 도입 이후 전종목
    # 스캔은 수십 분 내로 끝난다. 그래도 KIS 쪽 일시 장애 등 예상 밖의 지연에
    # 대비해 넉넉한 상한을 유지한다.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run screening batch
        run: npm run screen:all-stocks
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 스크리닝 배치가 갱신한 screening_results를 그대로 입력값으로 쓰므로 추가 KIS
      # 호출이 없다 — 그래서 같은 잡의 다음 스텝으로 이어 붙인다(별도 워크플로/스케줄 불필요).
      - name: Run AI paper trading batch
        run: npm run paper:trade
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
