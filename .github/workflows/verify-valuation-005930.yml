name: (임시) DH전략 과거 PER/PBR 재구성 가능성 진단 - DART fnlttSinglAcntAll

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dump DART fnlttSinglAcntAll raw response (read-only)
        run: npx tsx --conditions=react-server scripts/verify-valuation-005930.ts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
