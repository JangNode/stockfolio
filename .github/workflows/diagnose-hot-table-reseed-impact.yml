name: hot table 재시딩 영향 진단 (진단, 1회성)

# stock_daily_prices_recent 재시딩 전 dry-run(쓰기 없음): 실제 추가될 행 수,
# strategy_backtest_summary/benchmark_summary 최신 상태, ±30% 변동 월별 분포를
# 확인한다. 확인 끝나면 이 워크플로와
# scripts/diagnose-hot-table-reseed-impact.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # hot table 전체 스캔(페이지네이션)이 행 수가 많으면 시간이 걸릴 수 있어 넉넉히 잡음.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose hot table reseed impact
        run: npm run diagnose:hot-table-reseed-impact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
