name: (임시) DART 부채구조 null 필드 리필

# 수동 실행 전용. dart_debt_structure에서 short_term_debt/long_term_debt/
# bonds_payable 중 하나라도 null인 기존 행을 확장된 계정과목 후보 목록으로
# 재조회해 채운다. 커버리지가 충분히 개선된 걸 확인하면 이 워크플로/스크립트는
# 정리 PR로 제거한다(반복 배치가 아니라 1회성 보정).
on:
  workflow_dispatch: {}

jobs:
  refill:
    runs-on: ubuntu-latest
    # 재조회 대상이 수천 건에 달할 수 있고 CONCURRENCY=2 + 지수 백오프라 오래
    # 걸릴 수 있다(0단계 backfill-dart-cashflow-debt.ts와 동일한 근거로 넉넉히 잡음).
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refill DART debt structure nulls
        run: npm run refill:dart-debt-structure
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
