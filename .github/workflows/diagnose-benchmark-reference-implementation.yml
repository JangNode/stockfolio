        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          CAND_ONLY: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 PEAD 잠정실적 공정공시 점검 + 파일럿 (시험 아님, 읽기 전용, DART 연구용 키만 호출 150건 이내, 원문 비저장)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'prelim' }}
        run: npx tsx --conditions=react-server scripts/diagnose-pead-prelim.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 PEAD 잠정실적 파일럿 2차 (시험 아님, DART 연구용 키만, 원문 비저장, Storage 읽기 0)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'prelim2' }}
        run: npx tsx --conditions=react-server scripts/diagnose-pead-prelim-cmp.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 연구 PEAD 잠정실적(PE7): 0단계 psub가 만든 부분집합(.research-subset)을 pcol·pead7이 복원해 쓴다(Supabase Storage 읽기 0).
      - name: Restore 부분집합 (연구 PEAD 잠정실적)
        if: ${{ inputs.which == 'pcol' || inputs.which == 'pead7' }}
        uses: actions/cache/restore@v4
        with:
          path: .research-subset
          key: research-subset-20261028
          fail-on-cache-miss: true

      - name: Restore 파싱 결과 이어받기 (pcol은 only에 이전 실행 번호가 있을 때, pead7은 필수)
        if: ${{ (inputs.which == 'pcol' && inputs.only != '') || inputs.which == 'pead7' }}
        uses: actions/cache/restore@v4
        with:
          path: .research-prelim
          key: research-prelim-parsed-${{ inputs.only }}
          fail-on-cache-miss: true

      - name: 연구 PEAD 잠정실적 0단계 부분집합 구축 (Storage 읽기 이번 1회, 쓰기 0, 외부 요청 0)
        id: psub_build
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'psub' }}
        run: npx tsx --conditions=react-server scripts/build-pead-subset.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save 부분집합 (research-subset-20261028, 이미 있으면 저장 실패는 무시)
        if: ${{ steps.psub_build.conclusion == 'success' && inputs.which == 'psub' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .research-subset
          key: research-subset-20261028

      - name: 부분집합 아티팩트 (보관용)
        if: ${{ steps.psub_build.conclusion == 'success' && inputs.which == 'psub' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-subset-20261028
          path: .research-subset
          retention-days: 30

      - name: 연구 전략 배분 PE4 입력 부분집합 구축 (Storage 읽기 이번 1회, 쓰기 0, 외부 요청 0)
        id: pe4sub_build
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'pe4sub' }}
        run: npx tsx --conditions=react-server scripts/build-pead-subset.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save PE4 입력 부분집합 (research-alloc-pe4-inputs-20261028, 삭제 정리 패턴과 겹치지 않는 이름, 삭제 금지)
        if: ${{ steps.pe4sub_build.conclusion == 'success' && inputs.which == 'pe4sub' }}
        uses: actions/cache/save@v4
        with:
          path: .research-subset
          key: research-alloc-pe4-inputs-20261028

      - name: PE4 입력 부분집합 아티팩트 (보관용)
        if: ${{ steps.pe4sub_build.conclusion == 'success' && inputs.which == 'pe4sub' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-alloc-pe4-inputs-20261028
          path: .research-subset
          retention-days: 30

      - name: 연구 PEAD 잠정실적 대량 수집 + 품질 점검 (DART 연구용 키만, 원문 비저장, 시험 없음, Storage 읽기 0)
        id: pcol_run
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'pcol' }}
        run: npx tsx --conditions=react-server scripts/collect-pead-prelim.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          PCOL_SAMPLE: ${{ inputs.pilot }}
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          # nBookStore·researchHarness를 불러오면 Supabase 클라이언트가 만들어져 URL·키가 필요하다(이 스크립트는 Supabase를 호출하지 않는다).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save 파싱 결과 (research-prelim-parsed-<run id>)
        if: ${{ always() && inputs.which == 'pcol' && inputs.pilot != '1' && hashFiles('.research-prelim/prelim-parsed.parquet') != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .research-prelim
          key: research-prelim-parsed-${{ github.run_id }}

      - name: 파싱 결과 아티팩트 (보관용)
        if: ${{ always() && inputs.which == 'pcol' && hashFiles('.research-prelim/prelim-parsed.parquet') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-prelim-parsed-${{ github.run_id }}
          path: .research-prelim
          include-hidden-files: true
          retention-days: 30

      - name: 연구 PEAD 잠정실적 PE7 시험 (읽기 전용, 후보 1회, 부분집합+파싱 결과+고정 스냅샷+보조 파일, 외부 요청 0건, Storage 읽기 0)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'pead7' }}
        run: npx tsx --conditions=react-server scripts/research-pead-prelim.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          RESEARCH_SUBSET_DIR: .research-subset
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 PEAD 전용 Actions 캐시·아티팩트 정리 (연구 DB·Storage 접근 없음; only=list는 목록만, delete는 후보 패턴만 삭제)
        if: ${{ inputs.which == 'pclean' }}
        run: bash scripts/pead-cleanup-actions.sh "${{ inputs.only }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Supabase 연구 객체·수급 현황 (읽기 전용, 쓰기·삭제 0, 외부 요청 0)
        if: ${{ inputs.which == 'pinv' }}
        run: npx tsx --conditions=react-server scripts/diagnose-storage-inventory.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          INV_MODE: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 수급 보유 범위 점검 (읽기 전용, 고정 스냅샷 + Storage 수급 정리본, 외부 요청 0건, 가격 성과 계산 없음)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'pflow' }}
        run: npx tsx --conditions=react-server scripts/diagnose-flow-need.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 공개 문서 페이지 읽기 (KRX Open API·공공데이터포털·KIS 개발자센터 안내 페이지, API 호출·키 사용 없음)
        if: ${{ inputs.which == 'pdoc' }}
        run: |
          for u in "https://www.data.go.kr/dcat/metadata/15094808" "https://www.data.go.kr/data/15094808/openapi.do" "https://www.data.go.kr/data/15094775/openapi.do" "https://openapi.krx.co.kr/contents/OPP/MAIN/main/index.cmd" "https://apiportal.koreainvestment.com/apiservice-apiservice"; do
            echo "=== $u ($(date -u +%FT%TZ)) ==="
            code=$(curl -sL -m 30 -o /tmp/page.html -w "%{http_code} %{size_download}B %{time_total}s" "$u" || echo "curl 실패")
            echo "HTTP/크기/시간: $code"
            python3 - <<'PY'
          import re,html
          try:
              t=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          except Exception as e:
              print('읽기 실패',e); raise SystemExit
          t=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',t)
          t=re.sub(r'(?s)<[^>]+>',' ',t)
          t=html.unescape(re.sub(r'\s+',' ',t)).strip()
          print(t[:2600])
          PY
          done

      - name: 하네스 시가·고가·저가·거래대금 확장 검증 (읽기 전용, 고정 스냅샷, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'vohlc' }}
        run: npx tsx --conditions=react-server scripts/verify-ohlc-adjust.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 D 정정 거래대금 열 진단 (읽기 전용, 고정 스냅샷, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'vtv' }}
        run: npx tsx --conditions=react-server scripts/diagnose-trading-value.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Restore 수급 부분집합 (연구 D5)
        if: ${{ inputs.which == 'vgt' || inputs.which == 'wfrprep' || inputs.which == 'wfr' }}
        uses: actions/cache/restore@v4
        with:
          path: .research-flow
          key: research-flow-subset-20261028
          fail-on-cache-miss: true

      - name: 연구 D5용 수급 부분집합 구축 (Storage 읽기 이번 1회, 쓰기 0, 외부 요청 0)
        id: vflow_build
        if: ${{ inputs.which == 'vflow' }}
        run: npx tsx --conditions=react-server scripts/build-flow-subset.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save 수급 부분집합 (research-flow-subset-20261028)
        if: ${{ steps.vflow_build.conclusion == 'success' && inputs.which == 'vflow' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .research-flow
          key: research-flow-subset-20261028

      - name: 수급 부분집합 아티팩트 (보관용)
        if: ${{ steps.vflow_build.conclusion == 'success' && inputs.which == 'vflow' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-flow-subset-20261028
          path: .research-flow
          include-hidden-files: true
          retention-days: 30

      - name: 연구 D·T 시도 242~247 시험 (읽기 전용, 후보당 1회, 고정 스냅샷 + 보조 파일 + 수급 부분집합 캐시, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'vgt' }}
        run: npx tsx --conditions=react-server scripts/research-volume-gap-trend.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          CAND_ONLY: ${{ inputs.only == 'COUNT' && 'D1,D3,D5' || inputs.only }}
          SIGNAL_COUNT_ONLY: ${{ inputs.only == 'COUNT' && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 연구 WFR(시도 248~250): 특성 내보내기(TS) -> LightGBM 연 1회 재학습(Python) -> 시뮬레이션·게이트(TS). wfrprep은 후보 성과를 계산하지 않는 사전 점검, wfrsim은 저장된 점수로 3단계만 다시 돌리는 코드 오류 복구 전용.
      - name: 연구 WFR 특성·라벨 내보내기 (읽기 전용, 고정 스냅샷 + 보조 파일 + 수급 캐시, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && (inputs.which == 'wfrprep' || inputs.which == 'wfr') }}
        run: npx tsx --conditions=react-server scripts/wfr-export.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 WFR 파이썬 환경 (lightgbm 설치, 버전 기록)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && (inputs.which == 'wfrprep' || inputs.which == 'wfr') }}
        run: |
          python3 --version
          python3 -m pip install --break-system-packages lightgbm numpy
          python3 -c "import lightgbm, numpy, sys; print('python', sys.version.split()[0], '| lightgbm', lightgbm.__version__, '| numpy', numpy.__version__)"
          nproc

      - name: 연구 WFR 환경 점검 적합 (SMOKE, 성과 지표 없음)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'wfrprep' }}
        run: SMOKE=1 python3 scripts/wfr_train.py

      - name: 연구 WFR 학습·예측 (연 1회 확장 윈도우, 변형 12개)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'wfr' }}
        run: python3 scripts/wfr_train.py

      - name: Save 연구 WFR 점수 (코드 오류 복구용)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'wfr' && always() }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .wfr
          key: wfr-scores-${{ github.run_id }}

      - name: Restore 연구 WFR 점수 (wfrsim 전용)
        if: ${{ inputs.which == 'wfrsim' }}
        uses: actions/cache/restore@v4
        with:
          path: .wfr
          key: wfr-scores-${{ inputs.only }}
          fail-on-cache-miss: true

      - name: 연구 WFR 시뮬레이션·게이트 (사전 점검은 후보 성과 계산 없이 기준선 표만)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && (inputs.which == 'wfrprep' || inputs.which == 'wfr' || inputs.which == 'wfrsim') }}
        run: npx tsx --conditions=react-server scripts/research-walkforward-ranker.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          WFR_MODE: ${{ inputs.which == 'wfrprep' && 'prep' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 연구 브랜치 전용 읽기 전용 점검(PR #468 2단계 적용 전·후): Supabase 관리 API로 SELECT만 실행한다. 쓰기·마이그레이션 적용 없음.
      - name: 원격 마이그레이션·KODEX 표·RLS·권한 조회 (관리 API, SELECT만)
        if: ${{ inputs.which == 'kssverify' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            echo "--- $1"
            jq -n --arg q "$2" '{query: $q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq -c '.'
          }
          q "원격 마이그레이션 이력 전체 버전(건수와 목록)" "select count(*) as total, string_agg(version, ',' order by version) as versions from supabase_migrations.schema_migrations"
          q "kodex_sector 표 존재" "select table_name from information_schema.tables where table_schema = 'public' and table_name like 'kodex_sector%' order by table_name"
          q "RLS 상태" "select c.relname, c.relrowsecurity as rls, c.relforcerowsecurity as force_rls from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname like 'kodex_sector%' order by c.relname"
          q "RLS 정책(select 정책 없어야 함)" "select tablename, policyname, cmd, roles from pg_policies where schemaname = 'public' and tablename like 'kodex_sector%'"
          q "표 권한(anon·authenticated·PUBLIC)" "select table_name, grantee, string_agg(privilege_type, ',' order by privilege_type) as privs from information_schema.role_table_grants where table_schema = 'public' and table_name like 'kodex_sector%' and grantee in ('anon','authenticated','PUBLIC') group by table_name, grantee order by table_name, grantee"
          q "schedule_scrape_status 제약" "select conname, pg_get_constraintdef(oid) as def from pg_constraint where conrelid = 'public.schedule_scrape_status'::regclass order by conname"
          q "schedule_scrape_status 행(source)" "select source from public.schedule_scrape_status order by source"
          q "kodex_sector 행 수" "select (select count(*) from public.kodex_sector_signals) as signals, (select count(*) from public.kodex_sector_track) as track"

      # 연구 브랜치 전용 읽기 전용 점검(KODEX 첫 신호 상태): Supabase 관리 API로 SELECT만 실행한다. 쓰기·dispatch·함수 호출 없음. 키·토큰 값은 출력하지 않는다.
      - name: KODEX 신호 상태 조회 (관리 API, SELECT만)
        if: ${{ inputs.which == 'kssstatus' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query"
          Q() { jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-; }
          P() { echo "--- $1"; Q "$2" | jq -c 'if type=="array" then .[] else . end'; }
          P "현재 시각" "select now() as db_now, now() at time zone 'Asia/Seoul' as kst_now"
          P "cron.job: KODEX 항목(command 제외)" "select jobid, jobname, schedule, active from cron.job where jobname = 'trigger-kodex-sector-signal' or jobid = 150"
          P "cron.job_run_details: 작업 150 최근 10건" "select jobid, runid, status, left(coalesce(return_message, ''), 300) as return_message, start_time, end_time from cron.job_run_details where jobid = 150 order by start_time desc limit 10"
          P "net._http_response 최근 10건(본문 앞 300자, 요청 헤더는 이 표에 없음)" "select id, status_code, left(coalesce(content, ''), 300) as content_head, timed_out, left(coalesce(error_msg, ''), 300) as error_msg, created from net._http_response order by created desc limit 10"
          P "kodex_sector_signals 행 수와 최근" "select count(*) as n, max(signal_date)::text as last_signal_date, max(trade_date)::text as last_trade_date, max(computed_at) as last_computed_at from public.kodex_sector_signals"
          P "kodex_sector_signals 최근 행 요약" "select signal_date::text, trade_date::text, momentum_from::text, momentum_to::text, k200p_count, top_sectors, fallback_to_etf, computed_at from public.kodex_sector_signals order by signal_date desc limit 3"
          P "최근 신호 보유(종목 코드 수준)" "select signal_date::text, h->>'code' as code, h->>'name' as name, h->>'sector' as sector, h->>'weight' as weight, h->>'account_weight' as account_weight from public.kodex_sector_signals s, jsonb_array_elements(s.holdings) h where s.signal_date = (select max(signal_date) from public.kodex_sector_signals) order by (h->>'account_weight')::numeric desc"
          P "최근 신호 정리 전 보유" "select signal_date::text, h->>'code' as code, h->>'name' as name, h->>'sector' as sector, h->>'weight' as weight, h->>'account_weight' as account_weight from public.kodex_sector_signals s, jsonb_array_elements(s.pre_trim_holdings) h where s.signal_date = (select max(signal_date) from public.kodex_sector_signals) order by (h->>'account_weight')::numeric desc"
          P "kodex_sector_track 행 수" "select count(*) as n, max(trade_date)::text as last_trade_date from public.kodex_sector_track"
          P "schedule_scrape_status: KODEX_SECTOR" "select * from public.schedule_scrape_status where source = 'KODEX_SECTOR'"

      # 연구 브랜치 전용(PR #468 3단계): 등록 전 읽기 전용 확인. Supabase 관리 API로 SELECT만 실행한다(값 출력 없음, psql 직접 연결 없음).
      - name: pg_cron 등록 전 확인 (관리 API, SELECT만)
        if: ${{ inputs.which == 'ksspre' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query"
          Q() { jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-; }
          P() { echo "--- $1"; Q "$2" | jq -c 'if type=="array" then .[] else . end'; }
          P "vault: GITHUB_ACTIONS_PAT 존재 여부(값 출력 없음)" "select count(*) as named_secrets, count(*) filter (where decrypted_secret is not null) as with_value from vault.decrypted_secrets where name = 'GITHUB_ACTIONS_PAT'"
          P "확장(pg_net·pg_cron·vault)" "select extname, extversion from pg_extension where extname in ('pg_net', 'pg_cron', 'supabase_vault') order by extname"
          P "krx_trading_calendar 존재와 열" "select to_regclass('public.krx_trading_calendar')::text as rel, (select string_agg(column_name || ':' || data_type, ', ' order by ordinal_position) from information_schema.columns where table_schema = 'public' and table_name = 'krx_trading_calendar') as cols"
          P "krx_trading_calendar 범위" "select min(trade_date)::text as min_date, max(trade_date)::text as max_date, count(*) as n from public.krx_trading_calendar"
          P "2026-11월 달력(행 수·개장일 수)" "select count(*) as rows_in_nov, count(*) filter (where is_open) as open_days, min(trade_date)::text as first_day, max(trade_date)::text as last_day from public.krx_trading_calendar where trade_date between '2026-11-01' and '2026-11-30'"
          P "2026-10-26~11-06 달력 행" "select trade_date::text as d, to_char(trade_date, 'Dy') as dow, is_open from public.krx_trading_calendar where trade_date between '2026-10-26' and '2026-11-06' order by trade_date"
          P "cron.job 전체" "select jobid, jobname, schedule, active, command from cron.job order by jobid"
          P "같은 이름 작업(없어야 함)" "select count(*) as same_name from cron.job where jobname = 'trigger-kodex-sector-signal'"
          P "기존 KODEX 함수(없어야 함)" "select p.proname from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and (p.proname like 'kodex_sector%' or p.proname like 'trigger_kodex%') order by p.proname"
          P "cron.timezone" "select current_setting('cron.timezone', true) as cron_timezone"

      # 연구 브랜치 전용(PR #468 3단계): main의 docs/kodex-sector/pg_cron_register.sql을 관리 API로 한 번만 실행하고 읽기 전용으로 검증한다.
      # 이 단계는 trigger_kodex_sector_signal_dispatch()를 호출하지 않는다(dispatch·테스트 호출 금지). 날짜 검증은 kodex_sector_should_dispatch(date) 조회만 한다.
      - name: Checkout main (등록할 SQL)
        if: ${{ inputs.which == 'kssreg' }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: pg_cron 등록 (main의 SQL 1회) 및 읽기 전용 검증
        if: ${{ inputs.which == 'kssreg' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query"
          SQL_FILE=main-src/docs/kodex-sector/pg_cron_register.sql
          echo "main commit: $(git -C main-src rev-parse HEAD)"
          sha256sum "$SQL_FILE"
          grep -n "'0 1 \* \* 1-5'" "$SQL_FILE"
          echo "--- 등록 SQL 실행(1회)"
          jq -n --rawfile q "$SQL_FILE" '{query: $q}' | curl -sS -X POST "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- -w "\nHTTP %{http_code}\n"
          Q() { jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-; }
          P() { echo "--- $1"; Q "$2" | jq -c 'if type=="array" then .[] else . end'; }
          PR() { echo "--- $1"; Q "$2" | jq -r '.[] | to_entries[] | .value'; }
          P "cron.job: KODEX 항목" "select jobid, jobname, schedule, active, command, database, username from cron.job where jobname = 'trigger-kodex-sector-signal'"
          P "cron.job: 시장 국면 항목(그대로여야 함)" "select jobid, jobname, schedule, active, command from cron.job where jobname = 'trigger-market-regime'"
          P "cron.job 전체 개수" "select count(*) as jobs, count(*) filter (where active) as active_jobs from cron.job"
          P "함수 ACL과 보안 정의" "select p.proname, p.prosecdef as security_definer, p.proconfig, p.proacl::text as acl from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname in ('trigger_kodex_sector_signal_dispatch', 'kodex_sector_should_dispatch') order by p.proname"
          P "역할별 실행 권한(anon·authenticated는 false여야 함)" "select r.rolname, has_function_privilege(r.rolname, 'public.trigger_kodex_sector_signal_dispatch()', 'execute') as can_dispatch, has_function_privilege(r.rolname, 'public.kodex_sector_should_dispatch(date)', 'execute') as can_check from pg_roles r where r.rolname in ('anon', 'authenticated', 'service_role', 'postgres') order by r.rolname"
          P "routine_privileges(grantee 목록; PUBLIC 없어야 함)" "select routine_name, grantee, privilege_type from information_schema.routine_privileges where routine_schema = 'public' and routine_name in ('trigger_kodex_sector_signal_dispatch', 'kodex_sector_should_dispatch') order by routine_name, grantee"
          echo "--- 함수 정의: kodex_sector_should_dispatch (조회만, net.http_post 없음 확인용)"
          PR "def" "select pg_get_functiondef('public.kodex_sector_should_dispatch(date)'::regprocedure)"
          echo "--- 함수 정의: trigger_kodex_sector_signal_dispatch (dispatch는 이 함수만 한다)"
          PR "def" "select pg_get_functiondef('public.trigger_kodex_sector_signal_dispatch()'::regprocedure)"
          P "날짜 판정(kodex_sector_should_dispatch만 호출, 워크플로 호출 없음)" "select d::text as date, to_char(d, 'Dy') as dow, c.is_open as calendar_is_open, public.kodex_sector_should_dispatch(d) as should_dispatch from unnest(array['2026-10-29','2026-10-30','2026-11-01','2026-11-02','2026-11-03']::date[]) as d left join public.krx_trading_calendar c on c.trade_date = d order by d"
          P "오늘(KST) 판정" "select (now() at time zone 'Asia/Seoul')::date::text as today_kst, public.kodex_sector_should_dispatch((now() at time zone 'Asia/Seoul')::date) as should_dispatch"
          P "등록 직후 해당 job의 실행 기록(없어야 함)" "select count(*) as runs from cron.job_run_details d join cron.job j on j.jobid = d.jobid where j.jobname = 'trigger-kodex-sector-signal'"
          P "표 권한 비교(anon·authenticated)" "select table_name, grantee, string_agg(privilege_type, ',' order by privilege_type) as privs from information_schema.role_table_grants where table_schema = 'public' and table_name in ('kodex_sector_signals', 'kodex_sector_track', 'market_regime_daily', 'strategy_backtest_summary', 'krx_trading_calendar', 'schedule_scrape_status', 'beta_price_history') and grantee in ('anon', 'authenticated') group by table_name, grantee order by table_name, grantee"
          P "표 RLS·정책 수 비교" "select c.relname, c.relrowsecurity as rls, (select count(*) from pg_policies p where p.schemaname = 'public' and p.tablename = c.relname) as policies, (select string_agg(p.policyname || ':' || p.cmd, ',') from pg_policies p where p.schemaname = 'public' and p.tablename = c.relname) as policy_list from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' and c.relname in ('kodex_sector_signals', 'kodex_sector_track', 'market_regime_daily', 'strategy_backtest_summary', 'krx_trading_calendar', 'schedule_scrape_status', 'beta_price_history') order by c.relname"

      # 연구 LTR(시도 251~253): 연구 WFR이 저장한 예측 점수(Actions 캐시 wfr-scores-40616510084)를 그대로 재사용한다. lowprep은 캐시 존재 확인과 점수 파일 해시만(성과 계산 없음).
      - name: Restore 저장된 WFR 점수 (lowprep, 없어도 계속)
        id: wfr_scores_prep
        if: ${{ inputs.which == 'lowprep' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .wfr
          key: wfr-scores-40616510084

      - name: 저장된 WFR 점수 확인 (캐시 적중 여부, 파일 크기·해시; 성과 계산 없음)
        if: ${{ inputs.which == 'lowprep' }}
        run: |
          echo "cache-hit=${{ steps.wfr_scores_prep.outputs.cache-hit }} matched=${{ steps.wfr_scores_prep.outputs.cache-matched-key }}"
          ls -la .wfr 2>/dev/null || echo ".wfr 없음"
          for f in scores_M2.f32 scores_M3.f32 meta.json X.f32 dayIdx.i32 stockIdx.i32 raw20.f32; do [ -f ".wfr/$f" ] && sha256sum ".wfr/$f" || echo "없음: $f"; done

      - name: Restore 저장된 WFR 점수 (lowturn, 없으면 중단)
        if: ${{ inputs.which == 'lowturn' }}
        uses: actions/cache/restore@v4
        with:
          path: .wfr
          key: wfr-scores-40616510084
          fail-on-cache-miss: true

      - name: 연구 LTR 저회전 매매 규칙 W1~W3 시험 (읽기 전용, 후보당 1회, 저장된 점수 재사용, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'lowturn' }}
        run: npx tsx --conditions=react-server scripts/research-low-turnover.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Restore PE4 입력 부분집합 (alloc, 없으면 중단)
        if: ${{ inputs.which == 'alloc' || inputs.which == 'recycle' || inputs.which == 'ivalloc' || inputs.which == 'semidiag' || inputs.which == 'csat' || inputs.which == 'csdelay' || inputs.which == 'dsat' || inputs.which == 'ds4' || inputs.which == 'ds4fwd' }}
        uses: actions/cache/restore@v4
        with:
          path: .research-subset
          key: research-alloc-pe4-inputs-20261028
          fail-on-cache-miss: true

      - name: Restore 저장된 WFR 점수 (alloc, 없으면 중단)
        if: ${{ inputs.which == 'alloc' || inputs.which == 'recycle' || inputs.which == 'ivalloc' || inputs.which == 'semidiag' || inputs.which == 'csat' || inputs.which == 'csdelay' || inputs.which == 'dsat' || inputs.which == 'ds4' || inputs.which == 'ds4fwd' || inputs.which == 'ds56' }}
        uses: actions/cache/restore@v4
        with:
          path: .wfr
          key: wfr-scores-40616510084
          fail-on-cache-miss: true

      - name: 연구 ALLOC 전략 배분 P1~P3 시험 (읽기 전용, 후보당 1회, only=repro이면 구성요소 재현·일별 수익 저장만, 외부 요청 0건, Storage 읽기 0)
        id: alloc_run
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'alloc' }}
        run: npx tsx --conditions=react-server scripts/research-strategy-allocation.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          RESEARCH_SUBSET_DIR: .research-subset
          ALLOC_MODE: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save 구성요소 일별 순수익 (research-alloc-returns-<run id>, 삭제 정리 패턴과 겹치지 않는 이름, 삭제 금지)
        if: ${{ steps.alloc_run.conclusion == 'success' && inputs.which == 'alloc' && inputs.only == 'repro' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .alloc-returns
          key: research-alloc-returns-${{ github.run_id }}

      - name: 구성요소 일별 순수익·PE4 입력 아티팩트 (보관용)
        if: ${{ steps.alloc_run.conclusion == 'success' && inputs.which == 'alloc' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-alloc-files-${{ github.run_id }}
          path: |
            .alloc-returns
            .research-subset
          include-hidden-files: true
          retention-days: 90

      - name: Restore 이전 연구 일별 순수익 캐시 (recycle, 없어도 계속)
        id: alloc_ref
        if: ${{ inputs.which == 'recycle' || inputs.which == 'ivalloc' || inputs.which == 'semidiag' || inputs.which == 'csat' || inputs.which == 'csdelay' || inputs.which == 'dsat' || inputs.which == 'ds4' || inputs.which == 'ds4fwd' || inputs.which == 'ds56' || inputs.which == 'pre17' || inputs.which == 'ds6fu' || inputs.which == 'ds7' || inputs.which == 'ds89' || inputs.which == 'ds6reg' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .alloc-returns
          key: research-alloc-returns-40627267099

      - name: 연구 CAPREC 자본 재활용 배분 Q1~Q3 시험 (읽기 전용, 후보당 1회, only=repro이면 구성요소·P2 재현·PE4 분해 저장만, 외부 요청 0건, Storage 읽기 0)
        id: recycle_run
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'recycle' }}
        run: npx tsx --conditions=react-server scripts/research-capital-recycling.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          RESEARCH_SUBSET_DIR: .research-subset
          ALLOC_MODE: ${{ inputs.only }}
          ALLOC_OUT_DIR: .capr-returns
          ALLOC_REF_DIR: ${{ steps.alloc_ref.outputs.cache-hit == 'true' && '.alloc-returns' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save PE4 분해·일별 순수익 (research-capital-recycling-split-<run id>, 삭제 정리 패턴과 겹치지 않는 이름, 삭제 금지)
        if: ${{ steps.recycle_run.conclusion == 'success' && inputs.which == 'recycle' && inputs.only == 'repro' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .capr-returns
          key: research-capital-recycling-split-${{ github.run_id }}

      - name: PE4 분해·일별 순수익·PE4 입력 아티팩트 (보관용)
        if: ${{ steps.recycle_run.conclusion == 'success' && inputs.which == 'recycle' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-capr-files-${{ github.run_id }}
          path: |
            .capr-returns
            .research-subset
          include-hidden-files: true
          retention-days: 90

      - name: Restore 구성요소 일별 순수익 캐시 (riskdiag, 없으면 중단)
        if: ${{ inputs.which == 'riskdiag' }}
        uses: actions/cache/restore@v4
        with:
          path: .alloc-returns
          key: research-alloc-returns-40627267099
          fail-on-cache-miss: true

      - name: Restore PE4 분해 캐시 (riskdiag, 없으면 중단)
        if: ${{ inputs.which == 'riskdiag' }}
        uses: actions/cache/restore@v4
        with:
          path: .capr-returns
          key: research-capital-recycling-split-41359098160
          fail-on-cache-miss: true

      - name: 연구 진단 위험 수준을 맞춘 069500 대비 성과 (시험 아님, 번호 소진 없음, 기존 캐시만, Supabase 접속 없음, 외부 요청 0건)
        if: ${{ inputs.which == 'riskdiag' }}
        run: npx tsx scripts/diagnose-risk-matched-benchmark.ts

      - name: 연구 IVA 변동성 역수 배분 R1~R3 시험 (읽기 전용, 후보당 1회, only=repro이면 구성요소·P2 재현만, 외부 요청 0건, Storage 읽기 0)
        id: ivalloc_run
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'ivalloc' }}
        run: npx tsx --conditions=react-server scripts/research-inverse-vol-allocation.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336
          PARQUET_CACHE_FROZEN: "1"
          RESEARCH_DATA_END: "2026-10-26"
          BENCH_AUX_069500: "1"
          RESEARCH_SUBSET_DIR: .research-subset
          ALLOC_MODE: ${{ inputs.only }}
          ALLOC_OUT_DIR: .iva-returns
          ALLOC_REF_DIR: ${{ steps.alloc_ref.outputs.cache-hit == 'true' && '.alloc-returns' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 진단 삼성전자·SK하이닉스 기여 분해 (시험 아님, 번호 소진 없음, 기존 캐시·고정 스냅샷·069500 보조 파일만, 외부 요청 0건, Storage 읽기 0)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'semidiag' }}
        run: npx tsx --conditions=react-server scripts/diagnose-semiconductor-contribution.ts
