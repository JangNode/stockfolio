name: Sync DART Financials and Dividends

on:
  schedule:
    # 매주 월요일 한국시간(KST, UTC+9) 오전 5시 30분 = UTC 전주 일요일 20시 30분.
    # corp_code 매핑 동기화(sync-dart-corp-codes.yml, 월 05:00 KST)가 끝난 뒤에 돌아야
    # 매핑이 최신인 상태에서 대형주를 걸러낼 수 있어 30분 뒤로 잡았다. KIS 일일 스크리닝
    # 배치(screening.yml)와는 완전히 별개 — 훨씬 낮은 주기(주 1회)로 돈다.
    - cron: "30 20 * * 0"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # 유통주식수/지배주주순이익을 DART에서 종목당 개별(비동시성) 호출로 새로 받아오면서
    # (2026-08-26) 30분으로는 부족해져 늘렸다 — 실측: 300개 종목 시가총액 필터링에만
    # 3.5분, 그 뒤 재무제표 갱신 단계가 30분을 넘겨도 안 끝나 타임아웃으로 취소된 전례가
    # 있다(다음 배치 실행 로그로 실제 소요 시간을 확인해 더 조정할 수 있음).
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync DART financials and dividends for large-cap stocks
        run: npm run sync:dart-financials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
