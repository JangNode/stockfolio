name: 지수 시세 커버리지 + KRX 과거 데이터 가용성 진단 (1회성)

# "장기 백테스트" 벤치마크 비교 조사(2026-09-29)용. beta_price_history의 실제
# 커버리지(가장 오래된/최신 날짜)와 KRX Open API가 2016년처럼 오래된 날짜도
# 서빙하는지 확인한다. 둘 다 순수 조회 진단(쓰기 없음). 확인 끝나면 이 워크플로와
# 대응 스크립트(scripts/diagnose-index-price-coverage.ts,
# scripts/diagnose-krx-index-history-availability.ts)를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose index price coverage
        run: npm run diagnose:index-price-coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Diagnose KRX index history availability
        run: npm run diagnose:krx-index-history-availability
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
