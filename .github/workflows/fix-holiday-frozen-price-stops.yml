name: 휴장일 동결가 손절 정리 (1회성)

# 2026-09-24/25 추석 연휴(KRX 실제 휴장)에 동결된 KIS 실시간 시세로 잘못
# 손절·재매칭된 screening_results 행을 정리한다. 기본은 드라이런(계획만
# 출력)이고, apply 입력을 true로 줘야 실제로 DB에 반영한다. 정리 끝나면 이
# 워크플로와 scripts/fix-holiday-frozen-price-stops.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true로 주면 실제로 DB에 반영(기본은 드라이런)"
        required: false
        default: "false"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix holiday frozen-price stops
        run: npm run fix:holiday-frozen-price-stops
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIX_HOLIDAY_STOPS_APPLY: ${{ github.event.inputs.apply }}
