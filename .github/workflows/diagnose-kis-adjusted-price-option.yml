name: KIS 수정주가 옵션 실측 (진단, 1회성)

# lib/kis.ts가 FID_ORG_ADJ_PRC=0 / MODP=0을 고정으로 보내는 이유를 확인하기 위해
# 삼성전자(005930) + 상장폐지 종목 1개 + 참고로 애플(AAPL) 소규모 실측만 한다.
# 전종목 재조회 없음. 확인 끝나면 이 워크플로와
# scripts/diagnose-kis-adjusted-price-option.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose KIS adjusted price option
        run: npm run diagnose:kis-adjusted-price-option
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
