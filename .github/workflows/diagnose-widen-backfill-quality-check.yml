name: 전종목 확장 재백필 소형주 품질 확인 (진단, 1회성)

# 2015~2026 확장 재백필 각 단계 후 소형주 데이터 품질 확인용. 순수 조회 진단(쓰기
# 없음). 확인 끝나면 이 워크플로와 scripts/diagnose-widen-backfill-quality-check.ts를
# 정리 PR로 제거한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "확인할 연도(쉼표 구분, 최근->과거 순, 예: 2024,2025,2026)"
        type: string
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose widen backfill small-cap quality
        run: npm run diagnose:widen-backfill-quality-check
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          YEARS: ${{ inputs.years }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
