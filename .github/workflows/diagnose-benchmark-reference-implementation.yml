name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# 임시: 병합 스크립트 드라이런 1회 실행용(PR 전에 되돌린다). 읽기 전용, 외부 요청 없음.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge fundamentals (dry-run)
        run: npx tsx --conditions=react-server scripts/merge-fundamentals-into-stock-annual.ts --dry-run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
