name: (임시) 재무제표 커버리지 + CFS 이상 확인

# 수동 실행 전용, 순수 조회(읽기 전용) — DB만 조회하고 아무것도 쓰지 않는다.
# 확인 끝나면 스크립트와 함께 즉시 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose fundamentals coverage and CFS anomaly
        run: npm run diagnose:fundamentals-coverage-and-cfs-anomaly
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
