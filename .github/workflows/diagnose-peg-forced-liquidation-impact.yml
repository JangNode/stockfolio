name: Diagnose PEG Forced Liquidation Impact (temporary)

# PEG전략(peg_lynch) 미청산 포지션 강제 청산 수정 전/후 실측 비교용 디스포저블
# 워크플로. 읽기 전용 스크립트만 실행한다(scripts/diagnose-peg-forced-liquidation-impact.ts).
# 확인 후 삭제 예정.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # 3년치 재무·시세 시계열을 종목마다 조회하는 전종목 백테스트라 screening.yml급
    # 시간이 걸릴 수 있다.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostic script
        run: npm run diagnose:peg-forced-liquidation-impact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
