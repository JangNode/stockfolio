name: 지수 시세 과거 격차 백필 (1회성)

# "장기 백테스트" 벤치마크 비교 조사(2026-09-29)용. beta_price_history의
# 2016-01-01 이전 커버리지 격차를 KRX Open API로 채운다(기존 행은 건드리지 않고
# 오래된 날짜만 추가, market+trade_date 키 upsert). 실행 전 diagnose-index-
# coverage-and-krx-availability 워크플로로 예상 소요시간을 먼저 추정해야 한다.
# 목표 구간을 채우고 나면 이 워크플로와 대응 스크립트
# (scripts/backfill-index-daily-prices-historical-gap.ts)는 정리 PR로 제거한다.
on:
  workflow_dispatch:
    inputs:
      gap_start_date:
        description: "백필 시작일(YYYY-MM-DD)"
        required: true
        type: string
      gap_end_date:
        description: "백필 종료일(YYYY-MM-DD, 기존 최오래된 저장 날짜 하루 전)"
        required: true
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill KRX index daily prices (historical gap)
        run: npm run backfill:index-daily-prices-historical-gap
        env:
          GAP_START_DATE: ${{ inputs.gap_start_date }}
          GAP_END_DATE: ${{ inputs.gap_end_date }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
