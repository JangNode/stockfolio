name: 거래대금 대체값(종가×거래량) 오차 확인 (진단, 1회성)

# trading_value가 0인 2015~2022 기존 행에 쓰는 대체값이 2023년 이후 실제 거래대금과 얼마나
# 다른지 확인한다. 쓰기 없음. 확인 끝나면 이 워크플로와
# scripts/diagnose-trading-value-proxy.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check trading value proxy error
        run: npm run diagnose:trading-value-proxy
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
