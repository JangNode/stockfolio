name: 실험조합형 콜드스타트 17건 되돌리기 (1회성)

# 9/25 실험조합형(experimental_blend) KR 계좌의 첫 매수 17건을 전부
# 취소·원상복구한다(4단계, 사용자 확인 완료). 기본은 드라이런(계획만
# 출력)이고 apply 입력을 true로 줘야 실제로 DB에 반영한다. 정리 끝나면
# 이 워크플로와 scripts/revert-experimental-blend-cold-start.ts,
# scripts/diagnose-experimental-blend-cold-start.ts(.yml)를 정리 PR로
# 제거한다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true로 주면 실제로 DB에 반영(기본은 드라이런)"
        required: false
        default: "false"

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Revert experimental_blend cold start
        run: npm run revert:experimental-blend-cold-start
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVERT_EXPERIMENTAL_BLEND_APPLY: ${{ github.event.inputs.apply }}
