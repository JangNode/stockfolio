name: Verify Market Briefings (disposable)

# Cowork 시장 브리핑 웹훅 수집 기능(PR #293)의 DB 레이어를 실제 프로덕션
# Supabase에서 검증하기 위한 디스포저블 워크플로. scripts/verify-market-briefings.ts
# 참고. 검증이 끝나면 이 워크플로와 스크립트는 정리 PR로 제거한다(SKILLS.md).
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify market briefings DB layer
        run: npx tsx --conditions=react-server scripts/verify-market-briefings.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
