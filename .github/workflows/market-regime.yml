name: Market Regime

# 시장 국면(레짐) 카드용 일일 배치. 정시성이 필요해(직전 거래일 자료가 준비된 뒤 곧바로 계산) GitHub Actions 네이티브
# schedule 대신 Supabase pg_cron이 평일 10:00 KST(01:00 UTC, 전 거래일 종가 기준)에 이 워크플로의 workflow_dispatch를 직접 호출한다
# (등록 SQL은 docs/market-regime/pg_cron_register.sql — 2026-10-26 사용자 승인 후 등록. 평일 휴장일에는 SQL이 dispatch를 건너뛴다).
# 종목 시세 Parquet 현재 연도 파일은 계산 직전 단계에서 기존 backfill:stock-daily-prices(기존 날짜 건너뛰기, 새 행이 없으면 업로드 생략)로
# 증분 갱신한다. 같은 파일을 쓰는 주간 배치(compute-strategy-backtest-summary.yml)와 같은 concurrency 그룹을 공유해 동시에 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 직전 거래일 한 행 계산·저장, backfill = 2010-07~ 이력 백필(기본 드라이런)"
        required: false
        default: "daily"
      target:
        description: "mode=daily: 기준일(YYYY-MM-DD), 비우면 직전 거래일"
        required: false
        default: ""
      dry_run:
        description: "mode=daily: 1이면 저장·지수 갱신 없이 계산만"
        required: false
        default: "0"
      apply:
        description: "mode=backfill: 1이면 market_regime_daily에 없는 날짜만 입력(충돌 시 무시, 마이그레이션 적용 후에만)"
        required: false
        default: "0"

# 종목 시세 Parquet을 쓰는 워크플로(일일 국면, 주간 백테스트)와 국면 백필이 겹치지 않도록 한 번에 하나만 실행한다(실행 중인 것은 취소하지 않음).
# 주의: GitHub는 같은 그룹에 대기 중인 실행을 하나만 남기므로, 대기 중에 새 실행이 들어오면 이전 대기 실행은 취소된다.
concurrency:
  group: stock-price-parquet-refresh
  cancel-in-progress: false

jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 연도별 Parquet 가격 파일을 실행마다 다시 받지 않도록 디스크 캐시를 쓴다(lib/parquetDiskCache.ts).
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      - name: Reset Parquet cache dirty marker
        run: rm -f .parquet-cache/.dirty

      # 현재 연도 파일에 빠진 직전 거래일까지의 시세를 KRX Open API로 받아 붙인다(기존 날짜는 호출·덮어쓰기 없음).
      # 1월에는 작년 12월 말 공백을 메우려고 작년 파일도 본다(새 행이 없으면 업로드하지 않으므로 비용은 캐시 확인뿐).
      - name: Refresh current-year price parquet
        if: ${{ inputs.mode != 'backfill' && inputs.dry_run != '1' }}
        run: |
          YEAR=$(date -u +%Y)
          if [ "$(date -u +%m)" = "01" ]; then START=$((YEAR - 1)); else START=$YEAR; fi
          export BACKFILL_YEAR_RANGE_START=$START BACKFILL_YEAR_RANGE_END=$YEAR
          npm run backfill:stock-daily-prices
        env:
          SKIP_EXISTING_DATES: "true"
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Compute market regime (daily)
        if: ${{ inputs.mode != 'backfill' }}
        run: npm run market-regime
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          MARKET_REGIME_TARGET: ${{ inputs.target }}
          MARKET_REGIME_DRY_RUN: ${{ inputs.dry_run }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Backfill market regime history (dry run unless apply=1)
        if: ${{ inputs.mode == 'backfill' }}
        run: npm run backfill:market-regime
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          BACKFILL_APPLY: ${{ inputs.apply }}
          BACKFILL_SQL_PATH: ${{ runner.temp }}/market_regime_backfill.sql
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload backfill SQL
        if: ${{ inputs.mode == 'backfill' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-regime-backfill-sql
          path: ${{ runner.temp }}/market_regime_backfill.sql
          retention-days: 7

      - name: Check Parquet cache changes
        id: parquet_cache_state
        if: ${{ always() }}
        run: |
          if [ -f .parquet-cache/.dirty ]; then echo "dirty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Parquet cache
        if: ${{ always() && steps.parquet_cache_state.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
