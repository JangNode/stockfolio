name: 활성 스크리닝 전략 rule_type 확인 (진단, 1회성)

# "급등주 찾기 v1 vs v2 비교" 카드를 전체 전략 비교로 일반화하기 전,
# strategies 테이블에 실제로 존재하는 rule_type과 각각의
# screening_results 신호 수(전체/추적중/종료)를 확인한다. 순수
# 조회(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-active-screening-strategies.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose active screening strategies
        run: npm run diagnose:active-screening-strategies
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
