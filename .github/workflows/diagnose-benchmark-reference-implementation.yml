name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# scripts/diagnose-benchmark-reference-implementation.ts는 lib/benchmarkSummary.ts의
# 유니버스 동일가중 월간 리밸런싱 계산을 원자료에서 독립적으로 재구현한 참조
# 스크립트다(2026-09-29 CAGR/MDD 불일치 조사, 재현 가능성을 위해 영구 보존 —
# 이 스크립트 자체는 정리 대상이 아니다). 이 워크플로는 필요할 때 수동으로
# 다시 돌려 프로덕션 DB 값(benchmark_summary)과 교차검증하는 용도다. 순수
# 조회+계산(쓰기 없음).
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ma_cross market-cap criteria experiment (dry run, temp)
        run: |
          set +e
          for cap in 5000 3000 1000 500; do
            for slip in 0.001 0.003; do
              echo "=== cap=${cap}억 slippage=${slip}"
              UNIVERSE_MIN_MARKET_CAP_EOK=$cap EXP_SLIPPAGE_PCT=$slip /usr/bin/time -v npm run batch:strategy-backtest-summary 2>&1 | grep -E "월별 편입|\[ma_cross\]|universe_monthly_rebalance\]|\[kospi\]|\[kosdaq\]|low_confidence|실행 시간|Maximum resident|rror" 
            done
          done
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          DRY_RUN: "true"
          BACKTEST_WINDOW_START_YEAR: "2010"
          EXP_ONLY_MA_CROSS: "true"
          DATA_WIDEN_STAGE: pit_adjusted_exp
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
