      - name: 연구 DS6 포워드 1단계 검증 (고정 스냅샷, 기록값 4.10/24.51·11.70/39.15 재확인, 외부 요청 0건, Storage 읽기 0)
        id: ds6fwd_verify
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'ds6fwd' }}
        run: npx tsx --conditions=react-server scripts/research-ds6-forward.ts
        env:
