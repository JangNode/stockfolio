name: (임시) DH전략 시총 기준 변경 영향 확인

# 수동 실행 전용, 순수 조회(읽기 전용) — DB만 조회하고 아무것도 쓰지 않는다.
# 확인 끝나면 스크립트와 함께 즉시 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose DH market cap change impact
        run: npm run diagnose:dh-market-cap-change-impact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
