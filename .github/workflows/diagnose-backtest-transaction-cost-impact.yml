name: 장기 백테스트 거래비용 반영 영향 진단 (진단, 1회성)

# "장기 백테스트(2016~오늘)" 결과에 매매 수수료/증권거래세/슬리피지가 전혀 반영돼
# 있지 않다는 조사 결과(2026-09-29)를 바탕으로, 비용을 반영하면 5개 전략의
# CAGR/MDD/승률/손익비가 얼마나 바뀌는지 추정한다. 순수 조회+계산 진단(DB 쓰기 없음).
# 확인 끝나면 이 워크플로와 scripts/diagnose-backtest-transaction-cost-impact.ts를
# 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose transaction cost impact
        run: npm run diagnose:backtest-transaction-cost-impact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
