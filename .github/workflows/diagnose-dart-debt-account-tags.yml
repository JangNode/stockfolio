name: (임시) DART 장기차입금/사채 계정과목 진단

# 수동 실행 전용, 읽기 전용 진단(DB에 아무것도 쓰지 않음). 확인 끝나면 스크립트와
# 함께 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose DART debt account tags
        run: npm run diagnose:dart-debt-account-tags
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
