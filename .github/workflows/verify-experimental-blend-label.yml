name: (Temp) Verify experimental_blend label

# 20260927230000 마이그레이션이 paper_strategies의 실험조합형 라벨/설명을 실제로
# 갱신했는지 확인하는 1회성 검증. 확인 끝나면 정리 PR로 제거한다.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify experimental_blend label
        run: npm run verify:experimental-blend-label
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
