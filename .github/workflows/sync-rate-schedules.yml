name: Rate Schedule Sync

# FOMC/금통위 회의 일정을 매주 한 번 공식 페이지에서 자동 수집해 DB에 반영한다.
# 다른 배치와 같은 이유로 GitHub Actions의 schedule 트리거 대신 Supabase pg_cron이
# workflow_dispatch API를 직접 호출한다(supabase/migrations의
# 20260830110000_add_meeting_backoff_cron_registration.sql, 매주 월요일 KST 06:00).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync FOMC/MPC schedules
        run: npx tsx --conditions=react-server scripts/sync-rate-schedules.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
