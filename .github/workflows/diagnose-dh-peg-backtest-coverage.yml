name: (임시) DH/PEG전략 백테스트 커버리지 확인

# 수동 실행 전용, 순수 조회(읽기 전용) — DB만 조회하고 아무것도 쓰지 않는다.
# DH전략/PEG전략 조건 튜닝 분석의 0단계. 확인 끝나면 다른 분석용 임시 스크립트/
# 워크플로와 함께 정리 PR로 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose DH/PEG backtest coverage
        run: npm run diagnose:dh-peg-backtest-coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
