name: 진단 - 백테스트 유니버스 확장 데이터 현황 (조사용, 임시)

# scripts/diagnose-universe-expansion-data-landscape.ts 실행용 — 백테스트 유니버스를
# "시총 무관 전종목(상장폐지 포함), 시점별 편입"으로 넓히는 방안 조사(2026-09-29)의
# 1단계. 조사 종료 후 정리 PR로 이 워크플로/스크립트를 제거한다. 순수 조회+계산+콘솔
# 출력, DB에는 아무것도 쓰지 않는다.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run data landscape diagnosis
        run: npm run diagnose:universe-expansion-data-landscape
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
