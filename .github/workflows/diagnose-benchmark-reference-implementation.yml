name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# [임시 점검 브랜치 전용 — 병합 금지] 재무 데이터 2010~ 확보 가능성 점검(읽기 전용).
# 항목 1은 psql(집계/크기 조회, 읽기 전용), 항목 2~5는 scripts/probe-fundamentals-2010.ts(외부 요청 25건 이하).
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DB 보유 현황 (psql, 읽기 전용)
        continue-on-error: true
        run: |
          psql "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.yxknesiiwhtjpgbwvggp.supabase.co:5432/postgres" \
            -v ON_ERROR_STOP=0 \
            -f scripts/probe-fundamentals-2010.sql
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: DART / KRX 외부 요청 점검 (읽기 전용)
        run: npx tsx --conditions=react-server scripts/probe-fundamentals-2010.ts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
