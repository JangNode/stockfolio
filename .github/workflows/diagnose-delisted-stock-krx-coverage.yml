name: 상장폐지 종목 KRX 시세 커버리지 확인 (진단, 1회성)

# 생존편향 백필 0단계 — 순수 조회 진단(DB 쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-delisted-stock-krx-coverage.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose delisted stock KRX coverage
        run: npm run diagnose:delisted-stock-krx-coverage
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
