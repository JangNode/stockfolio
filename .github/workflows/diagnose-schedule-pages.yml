name: Diagnose Schedule Pages (temporary)

# FOMC/금통위 일정 자동 수집기를 만들기 전, 실제 페이지 HTML 구조를 확인하기 위한
# 1회성 진단 워크플로. 샌드박스에서 federalreserve.gov/bok.or.kr에 직접 접근이
# 막혀 있어 비프록시 환경인 GitHub Actions에서 실행해 로그로 원본 HTML을 확인한다.
# 파서 작성 후 이 워크플로/스크립트는 삭제한다.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch schedule pages
        run: npx tsx --conditions=react-server scripts/diagnose-schedule-pages.ts
