name: AI 모의투자 라이브 거래일수 확인 (진단, 1회성)

# 포트폴리오 MDD 분석용 — 안정형/공격형/급등주/커스텀 라이브 데이터가 며칠치
# 쌓여 있는지 확인한다. 순수 조회 진단(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-paper-trading-live-days.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose paper trading live days
        run: npm run diagnose:paper-trading-live-days
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
