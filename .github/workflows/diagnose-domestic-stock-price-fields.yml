name: Diagnose Domestic Stock Price Fields (temporary)

# 관심종목 카드 기준시점(국내 종목) 표시 기능 구현 전 조사용 디스포저블
# 워크플로. 읽기 전용 스크립트만 실행한다
# (scripts/diagnose-domestic-stock-price-fields.ts). 확인 후 삭제 예정.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostic script
        run: npm run diagnose:domestic-stock-price-fields
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
