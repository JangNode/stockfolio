name: (임시) 급등주 찾기 손절률 확장 백테스트 분석

# 수동 실행 전용, 순수 분석(읽기 전용) — screening_results/paper_trades 등 매매
# 실행 관련 테이블에는 아무것도 쓰지 않는다. 확인 끝나면 스크립트와 함께 즉시 삭제.
on:
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Analyze reversal_breakout stop-loss range
        run: npm run analyze:reversal-breakout-stoploss-range
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
