name: KRX 응답 필드 확인 (진단, 1회성)

# scripts/backfill-stock-daily-prices.ts가 실제로 쓰는 필드 외에 KRX 일별매매정보
# 응답에 조정계수/액면가/거래대금 등 추가 필드가 있는지 원본 JSON을 확인한다.
# 날짜 1~2개만 호출한다. 확인 끝나면 이 워크플로와
# scripts/diagnose-krx-response-fields.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose KRX response fields
        run: npm run diagnose:krx-response-fields
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
