name: 포트폴리오 배분 시뮬레이션 진단 (진단, 1회성)

# minervini_trend_template + peg_lynch 비중별 결합 시뮬레이션 + reversal_breakout
# 위성 슬롯 추가 효과 확인. 순수 조회+계산(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-portfolio-allocation-simulation.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose portfolio allocation simulation
        run: npm run diagnose:portfolio-allocation-simulation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
