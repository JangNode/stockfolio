name: Stock Screening Batch

on:
  # GitHub Actions의 schedule 트리거는 부하가 높을 때 몇 시간씩 지연될 수 있어(공식
  # 문서에 명시된 동작이며, 실측으로도 평일 05:30 UTC 예약이 07:29~08:08 UTC 사이로
  # 매번 2시간 안팎 지연되는 걸 확인했다) 여기서는 두지 않는다. 대신 Supabase의
  # pg_cron이 평일 한국시간(KST) 오후 2시 30분 = UTC 05:30에 이 워크플로의
  # workflow_dispatch API를 직접 호출한다(supabase/migrations의 pg_cron 잡 참고) —
  # schedule과 달리 workflow_dispatch는 지연 없이 거의 즉시 실행된다.
  workflow_dispatch:
    inputs:
      force_rescan:
        description: "오늘 이미 실행된 기록이 있어도 강제로 다시 스캔"
        type: boolean
        default: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # lib/kis.ts의 우선순위 토큰버킷(배치 초당 12건 + 병렬 처리) 도입 이후 전종목
    # 스캔은 수십 분 내로 끝난다. 그래도 KIS 쪽 일시 장애 등 예상 밖의 지연에
    # 대비해 넉넉한 상한을 유지한다.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run screening batch
        run: npm run screen:all-stocks
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_RESCAN: ${{ inputs.force_rescan }}

      # 스크리닝 배치가 갱신한 screening_results를 그대로 입력값으로 쓰므로 추가 KIS
      # 호출이 없다 — 그래서 같은 잡의 다음 스텝으로 이어 붙인다(별도 워크플로/스케줄 불필요).
      # 전략 JSON(data/paper-strategies/*.json)은 이 스텝이 만드는 게 아니라, 이보다
      # 앞선 시각(KST 14:10)에 도는 별도 Routine(Claude Code 세션)이 미리 커밋해둔다 —
      # Anthropic API 키 없이 이미 쓰는 Claude Code 접근을 재사용하기 위해서다.
      # 국내 가상 계좌만 처리한다 — 미국 가상 계좌는 screening-us.yml이 미국 스크리닝
      # 직후 별도로 처리한다(scripts/paper-trade.ts의 PAPER_TRADE_MARKET 참고).
      - name: Run AI paper trading batch (KR)
        run: npm run paper:trade
        env:
          PAPER_TRADE_MARKET: KR
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 로그성 배치 실행 기록(screening_runs, paper_runs) 정리. screening_runs는 국내/미국
      # 공용 테이블이라 하루 한 번(이 워크플로에서)만 정리하면 충분하다 — screening-us.yml에는
      # 중복으로 추가하지 않는다. 며칠 늦게 돌아도 해가 없는 작업이라 이 스텝 자체의
      # 실패/미실행에 대한 별도 감지는 두지 않는다.
      - name: Clean up old batch run logs
        run: npm run cleanup:logs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 실험실 탭 커스텀 백테스트도 국내/미국 공용 표(custom_backtest_runs)라 하루 한 번만
      # 정리하면 충분하다 — screening-us.yml에는 중복으로 추가하지 않는다.
      - name: Clean up old custom backtest results
        run: npm run cleanup:lab-backtests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
