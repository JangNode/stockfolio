name: 벤치마크 CAGR/MDD 불일치 진단 (진단, 1회성 + 참조구현 영구보존)

# lib/benchmarkSummary.ts의 유니버스 동일가중 월간 리밸런싱 CAGR/MDD 수치
# 불일치(이전 조사값 8.1%/-49.4% vs 정식 배치값 10.8%/-46.7%) 조사(2026-09-29)용.
# 순수 조회+계산(DB 쓰기 없음).
#
# - diagnose-benchmark-mismatch-isolation.ts: 격리 실험(조건 a~d). 조사가 끝나면
#   이 스텝과 스크립트, 이 워크플로 파일을 정리 PR로 제거한다.
# - diagnose-benchmark-reference-implementation.ts: 독립 참조 구현. 재현
#   가능성을 위해 조사가 끝나도 스크립트 자체는 남겨둔다(사용자 요청).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Isolation experiment (conditions a-d)
        run: npm run diagnose:benchmark-mismatch-isolation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Independent reference implementation
        run: npm run diagnose:benchmark-reference-implementation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
