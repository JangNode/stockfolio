      - name: 연구 DS8·DS9 시험 (읽기 전용, 후보당 1회, only=repro이면 재현·구조 자체 점검만, DART 호출 0, 외부 요청 0건, Storage 읽기 월말 목록 약 0.2 MiB)
        id: ds89_run
