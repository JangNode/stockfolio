name: 종목 시세 원자료 Storage 사용량 확인 (진단, 1회성)

# 생존편향 백필 3단계 실행 전 사전 확인용. 순수 조회 진단(쓰기 없음). 확인 끝나면
# 이 워크플로와 scripts/diagnose-stock-daily-prices-storage-usage.ts를 정리 PR로
# 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose stock-daily-prices storage usage
        run: npm run diagnose:stock-daily-prices-storage-usage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
