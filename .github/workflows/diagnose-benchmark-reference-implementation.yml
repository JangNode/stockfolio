name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# scripts/diagnose-benchmark-reference-implementation.ts는 lib/benchmarkSummary.ts의
# 유니버스 동일가중 월간 리밸런싱 계산을 원자료에서 독립적으로 재구현한 참조
# 스크립트다(2026-09-29 CAGR/MDD 불일치 조사, 재현 가능성을 위해 영구 보존 —
# 이 스크립트 자체는 정리 대상이 아니다). 이 워크플로는 필요할 때 수동으로
# 다시 돌려 프로덕션 DB 값(benchmark_summary)과 교차검증하는 용도다. 순수
# 조회+계산(쓰기 없음).
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "A peg first signal 2021-03-10 to today"
        run: echo "=== A peg first signal 2021-03-10 to today ===" && npm run batch:strategy-backtest-summary 2>&1 | grep -E "probe|ma_cross\\]|peg_lynch\\]|reversal_breakout_v2\\]|universe_monthly|kospi\\]|kosdaq\\]|rror"
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          DRY_RUN: "true"
          UNIVERSE_MIN_MARKET_CAP_EOK: "5000"
          DATA_WIDEN_STAGE: pit_adjusted_cap5000_from2010
          EXP_PERIOD_START_DATE: "2021-03-10"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "B v2 2010-01-01 to 2018-12-31"
        run: echo "=== B v2 2010-01-01 to 2018-12-31 ===" && npm run batch:strategy-backtest-summary 2>&1 | grep -E "probe|ma_cross\\]|peg_lynch\\]|reversal_breakout_v2\\]|universe_monthly|kospi\\]|kosdaq\\]|rror"
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          DRY_RUN: "true"
          UNIVERSE_MIN_MARKET_CAP_EOK: "5000"
          DATA_WIDEN_STAGE: pit_adjusted_cap5000_from2010
          EXP_PERIOD_START_DATE: "2010-01-01"
          EXP_PERIOD_END_DATE: "2018-12-31"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "C v2 2019-01-01 to today"
        run: echo "=== C v2 2019-01-01 to today ===" && npm run batch:strategy-backtest-summary 2>&1 | grep -E "probe|ma_cross\\]|peg_lynch\\]|reversal_breakout_v2\\]|universe_monthly|kospi\\]|kosdaq\\]|rror"
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          DRY_RUN: "true"
          UNIVERSE_MIN_MARKET_CAP_EOK: "5000"
          DATA_WIDEN_STAGE: pit_adjusted_cap5000_from2010
          EXP_PERIOD_START_DATE: "2019-01-01"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "D v2 2011-10-27 to 2018-12-31"
        run: echo "=== D v2 2011-10-27 to 2018-12-31 ===" && npm run batch:strategy-backtest-summary 2>&1 | grep -E "probe|ma_cross\\]|peg_lynch\\]|reversal_breakout_v2\\]|universe_monthly|kospi\\]|kosdaq\\]|rror"
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          DRY_RUN: "true"
          UNIVERSE_MIN_MARKET_CAP_EOK: "5000"
          DATA_WIDEN_STAGE: pit_adjusted_cap5000_from2010
          EXP_PERIOD_START_DATE: "2011-10-27"
          EXP_PERIOD_END_DATE: "2018-12-31"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

