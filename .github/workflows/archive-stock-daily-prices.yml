name: 종목 시세 원자료 hot/cold 아카이빙 (연 1회)

on:
  # 매년 1월 2일 UTC 01:00(KST 10:00)에 한 번. GitHub Actions의 schedule 지연
  # 문제(screening.yml 참고)는 연 1회짜리 작업엔 몇 시간 지연돼도 영향이 없어
  # pg_cron 대신 그냥 schedule을 쓴다.
  schedule:
    - cron: "0 1 2 1 *"
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 연도별 Parquet 가격 파일을 실행마다 다시 받지 않도록 디스크 캐시를 쓴다(lib/parquetDiskCache.ts).
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        uses: actions/cache/restore@v4
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      - name: Reset Parquet cache dirty marker
        run: rm -f .parquet-cache/.dirty

      - name: Archive stale hot-window prices into Parquet
        run: npm run archive:stock-daily-prices
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check Parquet cache changes
        id: parquet_cache_state
        if: ${{ always() }}
        run: |
          if [ -f .parquet-cache/.dirty ]; then echo "dirty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Parquet cache
        if: ${{ always() && steps.parquet_cache_state.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}
