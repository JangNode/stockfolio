name: (임시) 급등주 찾기 전략 실데이터 백테스트 진단

# 수동 실행 전용, 읽기 전용 진단(screening_results 등 운영 테이블에 아무것도 쓰지 않음 —
# lib/kis.ts의 kis_tokens 토큰 캐시 읽기/쓰기만 예외). 확인 끝나면 스크립트와 함께 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # 전종목(KOSPI+KOSDAQ) 대상으로 종목당 최대 800건 일봉을 수집하는 무거운 진단이라
    # 일반 스크리닝 배치보다 넉넉히 잡는다(SKILLS.md 참고, 예: 90~120분).
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose reversal breakout backtest
        run: npm run diagnose:reversal-breakout-backtest
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
