name: KODEX 200 + 업종 모멘텀 월간 신호

# 매월 첫 거래일 오전에 전월 마지막 거래일 종가 기준 신호를 계산한다(scripts/kodex-sector-signal.ts).
# 매매가 그날 종가라 몇 시간 밀리면 안 돼 GitHub schedule을 두지 않고, Supabase pg_cron이 평일
# 10:00 KST(UTC 01:00)에 workflow_dispatch를 부르되, 첫 거래일이 아니면 SQL(kodex_sector_should_dispatch)이 먼저 거른다
# (등록 SQL은 docs/kodex-sector/pg_cron_register.sql — 사용자 승인 전에는 등록하지 않는다). 그래도 이 워크플로가 떴는데 첫 거래일이 아니면 스크립트가 바로 끝난다.
# 외부 호출은 KRX Open API만(KIS 없음).
on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: "신호일(YYYY-MM-DD, 월 마지막 거래일). 비우면 오늘이 첫 거래일인지 보고 직전 거래일로 계산. 실패한 달을 다시 계산할 때만 쓴다."
        type: string
        default: ""

concurrency:
  group: kodex-sector-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute monthly signal
        run: npm run kodex:sector-signal
        env:
          KSS_SIGNAL_DATE: ${{ inputs.signal_date }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
