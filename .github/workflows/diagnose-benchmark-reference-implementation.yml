      - name: 연구 DS7 DS6 + 계좌 전체 노출 배율 시험 (읽기 전용, 1회, only=repro이면 재현·DS6 일관성·배율 구조 점검만, DART 호출 0, 외부 요청 0건, Storage 읽기 0)
