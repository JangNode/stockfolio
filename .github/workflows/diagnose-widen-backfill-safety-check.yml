name: 전종목 확장 재백필 안전성 확인 (진단, 1회성)

# 전종목 확장 재백필(#413)의 드라이런 안전성을 확인한다. MODE=before로 2023년
# 재백필 전 스냅샷을 뜨고, 2023년만 force_refetch_all_years로 재백필한 뒤
# MODE=after로 다시 돌려 대형주 표본 값이 그대로인지, Storage 사용량이 얼마나
# 늘었는지 비교한다. 확인 끝나면 이 워크플로와 diagnose-widen-backfill-safety-
# check.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "before 또는 after"
        type: choice
        options:
          - before
          - after
        default: before

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose widen-backfill safety
        run: npm run diagnose:widen-backfill-safety-check
        env:
          MODE: ${{ inputs.mode }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
