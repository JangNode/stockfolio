name: Diagnose Drive Folder (disposable)

# scripts/sync-market-briefing-drive.ts가 계속 "File not found" 404를 반환하는
# 원인을 실제 Drive API 응답으로 직접 확인하기 위한 디스포저블 진단 워크플로.
# scripts/diagnose-drive-folder.ts 참고. 원인 확인 후 정리 PR로 제거한다.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose Drive folder access
        run: npx tsx scripts/diagnose-drive-folder.ts
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
