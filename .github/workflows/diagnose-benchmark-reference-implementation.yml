name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# scripts/diagnose-benchmark-reference-implementation.ts는 lib/benchmarkSummary.ts의
# 유니버스 동일가중 월간 리밸런싱 계산을 원자료에서 독립적으로 재구현한 참조
# 스크립트다(2026-09-29 CAGR/MDD 불일치 조사, 재현 가능성을 위해 영구 보존 —
# 이 스크립트 자체는 정리 대상이 아니다). 이 워크플로는 필요할 때 수동으로
# 다시 돌려 프로덕션 DB 값(benchmark_summary)과 교차검증하는 용도다. 순수
# 조회+계산(쓰기 없음).
on:
  workflow_dispatch:
    inputs:
      which:
        description: "실행 선택: dart, kis, verify, test, q, q2fill, q2, rprobe, rfin, rverify, mm(월말 시장 구분 이어받기, 평일 15:40 KST 이후만), apre(연구 A 사전 점검, 읽기 전용), pname(우선주 쌍 종목명 대조, KRX 최대 40건, 14:00~15:40 KST 금지), c(연구 C 점검+시험, 읽기 전용), l(연구 L 대형주 집중 시험), a(연구 A 시험), b(연구 B 시험) 또는 r"
        required: false
        default: "dart"
      only:
        description: "which=test: 이번 차수에 실행할 후보(쉼표 구분, 예 P3,P4)"
        required: false
        default: ""
      before:
        description: "which=test: 이전 차수까지 실행한 시험 개수"
        required: false
        default: "0"
      pilot:
        description: "N 수집 파일럿(1이면 저장 없이 소규모 검증)"
        required: false
        default: "0"
      refetch:
        description: "which=rfin: 1이면 수정(oi-name-v1: 영업이익(손실) 변형 + 2026 사업연도 추가) 뒤 영업이익이 빈 묶음과 새 사업연도 묶음만 받는다(목록·업종 제외, fin.parquet만 올림)"
        required: false
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # 연도별 Parquet 가격 파일을 실행마다 다시 받지 않도록 디스크 캐시를 쓴다(lib/parquetDiskCache.ts).
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        id: parquet_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      - name: Reset Parquet cache dirty marker
        run: rm -f .parquet-cache/.dirty

      - name: Parquet cache gate (캐시 적중이 아니면 연구를 실행하지 않는다)
        id: parquet_gate
        env:
          MATCHED_KEY: ${{ steps.parquet_restore.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.parquet_restore.outputs.cache-hit }}
          # 2010~2026 중 여기 적은 연도만 캐시에 없어도 통과한다(공백 구분). 비워 두면 17개 파일(2010~2026)이 전부 캐시에 있어야 통과한다(엄격).
          ALLOWED_MISSING_YEARS: ""
        run: |
          echo "cache-matched-key=${MATCHED_KEY:-없음} exact-hit=${EXACT_HIT:-없음}"
          ls -la .parquet-cache 2>/dev/null | head -50 || true
          missing=""
          for y in $(seq 2010 2026); do
            if [ ! -f ".parquet-cache/$y.parquet" ] || [ ! -f ".parquet-cache/$y.parquet.meta.json" ]; then missing="$missing $y"; fi
          done
          echo "캐시에 없는 연도:${missing:- 없음}"
          blocked=false
          if [ -z "$MATCHED_KEY" ]; then blocked=true; fi
          for y in $missing; do
            case " $ALLOWED_MISSING_YEARS " in *" $y "*) ;; *) blocked=true ;; esac
          done
          if [ "$blocked" = "true" ]; then
            echo "gate=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::캐시가 적중이 아니라(복원 실패 또는 연도 파일 누락) 연구 스크립트를 실행하지 않습니다. 결과를 보고하고 지시를 받으세요."
          else
            echo "gate=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: N 단계 1 DART 수집 (Storage Parquet만 쓰기)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which != 'kis' && inputs.which != 'verify' && inputs.which != 'test' && inputs.which != 'q' && inputs.which != 'q2fill' && inputs.which != 'q2' && inputs.which != 'rprobe' && inputs.which != 'rfin' && inputs.which != 'rverify' && inputs.which != 'mm' && inputs.which != 'apre' && inputs.which != 'pname' && inputs.which != 'a' && inputs.which != 'b' && inputs.which != 'c' && inputs.which != 'l' && inputs.which != 'r' }}
        run: npx tsx --conditions=react-server scripts/collect-n-dart.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          N_PILOT: ${{ inputs.pilot }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: N 단계 1 KIS 수급 보완 수집 (Storage Parquet만 쓰기, pilot=1이면 추정만)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'kis' }}
        run: npx tsx --conditions=react-server scripts/collect-n-kis-flow.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          N_PILOT: ${{ inputs.pilot }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: N 단계 1 검증 보고 (읽기 전용)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'verify' }}
        run: npx tsx --conditions=react-server scripts/verify-n-collection.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: N 단계 2 후보 시험 (읽기 전용, 후보당 1회)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'test' }}
        run: npx tsx --conditions=react-server scripts/research-n-book-canon.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          N_ONLY: ${{ inputs.only }}
          N_BEFORE: ${{ inputs.before }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Q 유니버스 확장 시험 Q1~Q3 (읽기 전용, 1회)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'q' }}
        run: npx tsx --conditions=react-server scripts/research-q-universe.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Q2 업종 보완 수집 (DART company.json, Storage Parquet만 쓰기)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'q2fill' }}
        run: npx tsx --conditions=react-server scripts/collect-q2-sector-fill.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}

      - name: Q2 재시험 Q2·Q4 (읽기 전용, 1회)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'q2' }}
        run: npx tsx --conditions=react-server scripts/research-q2-sector-fill.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: R 원인 확인 rprobe (DART 연구용 키, 호출 20건 이내, 읽기 전용)
        if: ${{ inputs.which == 'rprobe' }}
        run: npx tsx --conditions=react-server scripts/probe-r-accounts.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}

      - name: R 단계 1 재무 재수집 (DART 연구용 키, Storage Parquet만 쓰기)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'rfin' }}
        run: npx tsx --conditions=react-server scripts/collect-r-fin.ts
        env:
          R_REFETCH_FIN: ${{ inputs.refetch }}
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY_3: ${{ secrets.DART_API_KEY_3 }}
          DART_API_KEY_2: ${{ secrets.DART_API_KEY_2 }}

      - name: R 단계 1 검증 보고 (읽기 전용)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'rverify' }}
        run: npx tsx --conditions=react-server scripts/verify-r-collection.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 월말 시장 구분 이어받기 (KRX Open API만, 새 (날짜, 시장)만, Storage Parquet만 저장; KST 14:00~15:40 실행 금지)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'mm' }}
        run: |
          HM=$(TZ=Asia/Seoul date +%H%M)
          if [ "$HM" -ge 1400 ] && [ "$HM" -lt 1540 ]; then echo "::error::KST $HM — 14:00~15:40에는 KRX·KIS 호출을 하지 않는다"; exit 1; fi
          npx tsx --conditions=react-server scripts/collect-market-membership.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 A 사전 점검 (읽기 전용, 수익률 계산 없음, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'apre' }}
        run: npx tsx --conditions=react-server scripts/precheck-a-pref-spread.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 A 우선주 쌍 종목명 대조 (KRX Open API 최대 40건, 읽기 전용; KST 14:00~15:40 실행 금지)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'pname' }}
        run: |
          HM=$(TZ=Asia/Seoul date +%H%M)
          if [ "$HM" -ge 1400 ] && [ "$HM" -lt 1540 ]; then echo "::error::KST $HM — 14:00~15:40에는 KRX·KIS 호출을 하지 않는다"; exit 1; fi
          npx tsx --conditions=react-server scripts/check-pref-pair-names.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 C(투자 대가 종합 점수) 커버리지·진입 기회 점검 후 통과 후보만 시험 (읽기 전용, 1회, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'c' }}
        run: npx tsx --conditions=react-server scripts/research-c-guru.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          CAND_ONLY: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 L(시총 최상위 대형주 집중 + 200일선 이탈 청산) L1~L3 시험 (읽기 전용, 후보당 1회, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'l' }}
        run: npx tsx --conditions=react-server scripts/research-l-megacap.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          CAND_ONLY: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 A 시험 A1(204)·A2(205) (읽기 전용, 후보당 1회, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'a' }}
        run: npx tsx --conditions=react-server scripts/research-a-pref-spread.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          CAND_ONLY: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 연구 B 시험 B1(206)·B2(207) (읽기 전용, 후보당 1회, 외부 요청 0건)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'b' }}
        run: npx tsx --conditions=react-server scripts/research-b-lowvol-momentum.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          CAND_ONLY: ${{ inputs.only }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: R 단계 2 시험 R0~R4 (읽기 전용, 1회)
        if: ${{ steps.parquet_gate.outputs.gate == 'ok' && inputs.which == 'r' }}
        run: npx tsx --conditions=react-server scripts/research-r-allcap.ts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check Parquet cache changes
        id: parquet_cache_state
        if: ${{ always() }}
        run: |
          if [ -f .parquet-cache/.dirty ]; then echo "dirty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Parquet cache
        if: ${{ always() && steps.parquet_cache_state.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
