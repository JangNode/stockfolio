name: (Temp) Diagnose backtest MDD/CAGR mismatch

# 디스포저블 분석 워크플로 — 장기 백테스트 결과의 MDD/CAGR/승률 조합이 이상해
# 보인다는 제보를 확인한다(트레이드 단위 소수 의존 + 승률-손익비 일관성). 코드
# 변경 없음(순수 분석, DB insert 없음). 확인 후 정리 PR로 스크립트/워크플로 제거.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose backtest MDD/CAGR mismatch
        run: npm run diagnose:backtest-mdd-cagr-mismatch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
