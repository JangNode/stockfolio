name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# [임시 브랜치 전용 — 병합 금지] KODEX 업종 모멘텀 신호 사전 점검(읽기 전용): 2026-10-28 10:00~11:00 KST에 KRX 전 영업일 자료 확인(2건)과
# 원격 schedule_scrape_status 제약·마이그레이션 이력 조회(Supabase 관리 API, SELECT만). 쓰기·마이그레이션 적용 없음.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: KRX 전 영업일(20261027) 자료 확인 (KRX 호출 2건, KST 2026-10-28 10:00~11:00에만 호출)
        run: npx tsx scripts/diagnose-kss-preflight.ts
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}

      - name: 원격 schedule_scrape_status 제약·마이그레이션 이력 조회 (관리 API, SELECT만)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            echo "--- $1"
            jq -n --arg q "$2" '{query: $q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq -c '.'
          }
          q "schedule_scrape_status 제약(허용값 전체)" "select conname, pg_get_constraintdef(oid) as def from pg_constraint where conrelid = 'public.schedule_scrape_status'::regclass order by conname"
          q "schedule_scrape_status 현재 행의 source" "select source from public.schedule_scrape_status order by source"
          q "원격 마이그레이션 이력(최신 3건과 건수)" "select (select count(*) from supabase_migrations.schema_migrations) as total, version, name from supabase_migrations.schema_migrations order by version desc limit 3"
