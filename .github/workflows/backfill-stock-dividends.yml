name: 종목 배당 원자료 백필 - 배당 이력 (3단계)

# 수동 실행 전용. 1단계(KRX 시세 백필)가 먼저 끝나 있어야 후보종목 발굴이 된다.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 연도별 Parquet 가격 파일을 실행마다 다시 받지 않도록 디스크 캐시를 쓴다(lib/parquetDiskCache.ts).
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      - name: Reset Parquet cache dirty marker
        run: rm -f .parquet-cache/.dirty

      - name: Backfill dividend history
        run: npm run backfill:stock-dividends
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check Parquet cache changes
        id: parquet_cache_state
        if: ${{ always() }}
        run: |
          if [ -f .parquet-cache/.dirty ]; then echo "dirty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Parquet cache
        if: ${{ always() && steps.parquet_cache_state.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
