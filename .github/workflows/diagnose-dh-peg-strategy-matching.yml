name: (임시) DH전략/PEG전략 매칭 0건 원인 진단

# 수동 실행 전용, 읽기 전용 진단(DB에 아무것도 쓰지 않음). 확인 끝나면 스크립트와 함께 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # 후보 종목(시총 1조원 이상 이력 종목) 각각의 재무/배당 이력 + 오늘자 시세를
    # 조회하는 진단이라 일반 스크리닝 배치보다 여유 있게 잡는다.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose DH/PEG strategy matching
        run: npm run diagnose:dh-peg-strategy-matching
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
