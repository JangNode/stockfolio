name: 지수 시세 구간 조회 페이지네이션 검증 (검증, 1회성)

# lib/betaPriceHistoryStorage.ts의 getIndexPriceSeries가 Supabase/PostgREST
# 기본 1000행 캡을 range() 페이지네이션으로 우회하는지 실데이터로 확인한다.
# 순수 조회 검증(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/verify-index-price-series-pagination.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify index price series pagination
        run: npm run verify:index-price-series-pagination
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
