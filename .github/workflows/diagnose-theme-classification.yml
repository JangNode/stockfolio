name: (임시) 테마 구성종목 분류 검증

# 수동 실행 전용, 읽기 전용 진단(DB/코드 변경 없음). 확인 끝나면 스크립트와 함께 삭제.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose theme classification
        run: npm run diagnose:theme-classification
