name: (임시) DH전략 과거 PER/PBR 재구성 가능성 진단 - KRX 일별매매정보

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dump KRX stk_bydd_trd raw response (read-only)
        run: npx tsx --conditions=react-server scripts/verify-valuation-005930.ts
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
