name: (1회성) reversal_breakout 종료된 스크리닝 결과 리플레이 보정

# 경고: 이 워크플로는 프로덕션 데이터를 실제로 수정한다(screening_results의
# stopped/profited 행을 올바른 기준으로 재계산해 덮어쓴다). dry-run 옵션 없음 —
# 실행 전 반드시 lib/backtest.ts의 computeReversalBreakoutEntryPrice 수정과
# 20260907000000 마이그레이션이 먼저 적용됐는지 확인할 것. 수동 실행 전용.
on:
  workflow_dispatch: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay reversal_breakout closed screening results
        run: npm run replay:reversal-breakout-closed-results
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
