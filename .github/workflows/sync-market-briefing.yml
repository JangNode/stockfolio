name: Sync Market Briefing from Drive

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 7시 30분 = UTC 22시 30분. "증시근황" 섹션에
    # 표시만 되는 데이터라 몇 시간 밀려도 실피해가 없어 pg_cron 대신 GitHub Actions
    # 네이티브 schedule 트리거를 쓴다(SKILLS.md 배치 스케줄링 방식 선택 기준).
    - cron: "30 22 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # Drive API 호출 몇 번뿐이라 5분이면 충분하다.
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync market briefing from Drive
        run: npm run sync:market-briefing-drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
