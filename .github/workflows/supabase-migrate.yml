name: Apply Supabase Migrations

# 수동 실행 전용. 스키마 변경은 되돌리기 어려운 경우가 있어(컬럼 삭제 등)
# main에 머지될 때마다 자동으로 적용하지 않고, 필요할 때 사람이 직접 돌린다.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref yxknesiiwhtjpgbwvggp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 임시(임시 브랜치 전용, 병합 금지): 적용 결과를 Supabase 관리 API(REST, 읽기 전용 SELECT)로 확인한다.
      - name: Compare remote migration history with local files (read-only, NO push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -n --arg q "select version, name from supabase_migrations.schema_migrations order by version" \
            | curl -sS -X POST "https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- > remote.json
          head -c 300 remote.json; echo
          jq -r '.[] | "\(.version) \(.name)"' remote.json | sort > remote.txt
          ls supabase/migrations | sed -E 's/^([0-9]+)_(.*)\.sql$/\1 \2/' | sort > local.txt
          echo "--- 원격 이력 ${REMOTE_COUNT:-}$(wc -l < remote.txt)건, 로컬 파일 $(wc -l < local.txt)건"
          echo "--- 원격 최근 14건(버전 이름 구문수)"; tail -14 remote.txt
          echo "--- 버전+이름 비교: 원격에만 있음 / 로컬에만 있음"
          cut -d' ' -f1,2 remote.txt > r2.txt
          echo "[원격에만]"; comm -23 r2.txt local.txt
          echo "[로컬에만]"; comm -13 r2.txt local.txt
          echo "--- 비교 끝"
