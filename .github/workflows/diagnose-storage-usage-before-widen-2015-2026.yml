name: 전체 Storage 사용량 확인 - 2015~2026 확장 전 (진단, 1회성)

# 전종목 확장 재백필을 2015~2026으로 넓히기 전 사전 확인용. 순수 조회 진단(쓰기
# 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-storage-usage-before-widen-2015-2026.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose total storage usage before 2015-2026 widen backfill
        run: npm run diagnose:storage-usage-before-widen-2015-2026
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
