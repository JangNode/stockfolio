name: US Stock Screening Batch

on:
  schedule:
    # 뉴욕 정규장 마감(동부시간 16:00) 1시간 전인 동부시간 15:00에 배치를 돌린다.
    # GitHub Actions cron은 고정 UTC 시각만 지원해 서머타임/표준시 스케줄을 하나로 합칠
    # 수 없으므로, 두 경우에 해당하는 UTC 시각을 크론 두 개로 각각 등록해둔다. 뉴욕
    # 월~금요일 15:00은 UTC로도 같은 날짜(시차만큼 더한 같은 요일)라 크론 요일은 그대로
    # 월~금(1-5)이다.
    #   - 서머타임(EDT, UTC-4): 동부 15:00 = UTC 19:00 (KST 익일 04:00)
    - cron: "0 19 * * 1-5"
    #   - 표준시(EST, UTC-5): 동부 15:00 = UTC 20:00 (KST 익일 05:00)
    - cron: "0 20 * * 1-5"
    # 매일 두 크론이 모두 트리거되지만, 스크립트 내부(scripts/screen-us-stocks.ts,
    # lib/usMarketCalendar.ts의 determineUsBatchSchedule)가 오늘이 서머타임인지 날짜
    # 계산으로 직접 판별해 예정된 시각과 다른 쪽 실행은 즉시 종료(스킵)한다.
  workflow_dispatch: {}

jobs:
  screen:
    runs-on: ubuntu-latest
    # 나스닥+뉴욕+아멕스 전종목 스캔이라 국내보다 유니버스가 훨씬 크다. 넉넉한 상한을 둔다.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run US stock screening batch
        run: npm run screen:us-stocks
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
