name: 좁은/넓은 원자료 백테스트 비교 (진단, 1회성)

# minervini/reversal_breakout_v2를 좁은(옛 필터 재현)·넓은 원자료에서 비용 반영/미반영으로
# 각각 계산해 비교한다. 쓰기 없음. 확인 끝나면 이 워크플로와
# scripts/diagnose-wide-vs-narrow-backtest.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare wide vs narrow backtest
        run: npm run diagnose:wide-vs-narrow-backtest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
