name: Inspect Market Briefing Rows (temporary)

# Cowork 브리핑 날짜 어긋남 문제 처리 방안을 정하기 전 조사용 디스포저블
# 워크플로. 읽기 전용 스크립트만 실행한다
# (scripts/inspect-market-briefing-rows.ts). 확인 후 삭제 예정.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run inspect script
        run: npm run inspect:market-briefing-rows
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
