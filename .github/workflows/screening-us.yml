name: US Stock Screening Batch

on:
  # GitHub Actions의 schedule 트리거는 부하가 높을 때 몇 시간씩 지연될 수 있어(screening.yml
  # 전환 때 실측으로 확인) 여기서는 두지 않는다. 대신 Supabase의 pg_cron이 뉴욕 정규장
  # 마감(동부시간 16:00) 1시간 전인 동부시간 15:00에 맞춰 이 워크플로의 workflow_dispatch
  # API를 직접 호출한다(supabase/migrations 참고) — schedule과 달리 workflow_dispatch는
  # 지연 없이 거의 즉시 실행된다.
  #
  # pg_cron도 고정 UTC 시각만 지원해 서머타임/표준시 스케줄을 하나로 합칠 수 없으므로,
  # 두 경우에 해당하는 UTC 시각마다 각각 잡을 등록해두고(뉴욕 월~금요일 15:00은 UTC로도
  # 같은 날짜라 요일은 그대로 월~금) 이번 호출이 어느 쪽인지를 schedule_cron 입력으로
  # 넘겨준다. 평일마다 이 워크플로가 하루 두 번 호출되는데, 그중 오늘 서머타임 여부와
  # 안 맞는 한 번은 스크립트 내부(scripts/screen-us-stocks.ts, lib/usMarketCalendar.ts의
  # determineUsBatchSchedule)가 판별해 즉시 종료(스킵)한다.
  #   - 서머타임(EDT, UTC-4): 동부 15:00 = UTC 19:00 (KST 익일 04:00)
  #   - 표준시(EST, UTC-5): 동부 15:00 = UTC 20:00 (KST 익일 05:00)
  workflow_dispatch:
    inputs:
      schedule_cron:
        description: "이 실행을 발화시킨 pg_cron 잡의 목표 cron 표현식(서머타임/표준시 판별용). 사람이 수동 실행할 땐 비워두면 가드 없이 항상 실행됨"
        type: string
        required: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 당분간 나스닥+뉴욕만 스캔한다(lib/stockMasterOverseas.ts의 ACTIVE_EXCHANGES 참고).
    # 그래도 KIS 호출 속도 제한이 국내와 공유되는 점을 감안해 넉넉한 상한을 둔다.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run US stock screening batch
        run: npm run screen:us-stocks
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 pg_cron 잡이 이 실행을 발화시켰는지(워크플로 시작 시점에 고정되는 입력값) —
          # lib/usMarketCalendar.ts의 determineUsBatchSchedule 참고. "지금 UTC
          # 몇 시인지"를 벽시계로 다시 재지 않기 위해 스텝마다 명시적으로 넘긴다.
          GITHUB_EVENT_SCHEDULE: ${{ inputs.schedule_cron }}

      # 스크리닝 배치가 갱신한 screening_results를 그대로 입력값으로 쓰므로 추가 KIS
      # 호출이 없다 — 그래서 같은 잡의 다음 스텝으로 이어 붙인다. 미국 가상 계좌만
      # 처리한다(국내는 screening.yml이 국내 스크리닝 직후 별도로 처리). 이 스텝도
      # scripts/paper-trade.ts 내부에서 위 스크리닝 스텝과 동일한 서머타임/표준시
      # 판별로 두 크론 중 맞지 않는 쪽을 건너뛴다. 스크리닝 스텝이 오래 걸려 이 스텝이
      # 다음 UTC 시간대로 넘어가 시작되더라도 GITHUB_EVENT_SCHEDULE은 워크플로 시작
      # 시점 값 그대로라 스스로를 잘못 스킵하지 않는다.
      - name: Run AI paper trading batch (US)
        run: npm run paper:trade
        env:
          PAPER_TRADE_MARKET: US
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_SCHEDULE: ${{ inputs.schedule_cron }}
