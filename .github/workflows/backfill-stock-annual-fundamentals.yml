name: 종목 재무 원자료 백필 - DART 재무제표/현금흐름/부채 (2단계)

# 최초 백필은 1단계(KRX 시세 백필)가 먼저 끝나 있어야 후보종목 발굴이 된다.
# (stock_code, fiscal_year) 조합이 이미 있으면 건너뛰는 idempotent 스크립트라, 상시
# 갱신도 같은 스크립트를 그대로 재실행하면 된다 — 새로 공시된 사업보고서(대부분
# 2~3월에 몰림)와 새로 후보 기준을 넘긴 종목만 자동으로 채워진다. 분기 1회면
# 충분해 분기별 첫째 주(1/4/7/10월 5일)에 재실행한다. 다른 배치(screening, DART
# corp_code 동기화)와 겹치지 않는 시간대를 골랐고, 연 1회짜리 아카이빙 워크플로와
# 같은 이유로 GitHub Actions의 schedule 지연은 이 작업엔 영향이 없어 pg_cron 대신
# 그냥 schedule을 쓴다.
#
# RIM/DCF용 현금흐름표/부채구조 백필(scripts/backfill-dart-cashflow-debt.ts)도 같은
# 원자료(DART fnlttSinglAcntAll) 성격이라 새 워크플로를 따로 만들지 않고 같은
# 스케줄에 얹는다(SKILLS.md 배치 스케줄링 원칙 — 하루 정도 늦어도 무방한 정적
# 데이터라 pg_cron까지 갈 필요 없음). 방법A(업종 평균 PER)의 업종 분류 백필
# (scripts/backfill-stock-industry-classification.ts)도 같은 이유(DART 원자료,
# 정적 데이터)로 이 워크플로에 세 번째 스텝으로 얹는다.
on:
  schedule:
    - cron: "0 2 5 1,4,7,10 *"
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 후보종목×연도 조합 수천 건씩 두 스텝, DART 일일 한도 40,000회 안에서 한 번에
    # 끝날 것으로 예상되지만 넉넉히 잡는다. 2026-09-03 실측(burst rate limit 추정
    # "fetch failed" 대량 발생, scripts/backfill-dart-cashflow-debt.ts 주석 참고)
    # 이후 두 스텝 모두 동시성을 8→2로 낮췄다(2026-09-07: 재무제표 스텝도 뒤늦게
    # 같은 수정 적용 — 그 전까지는 이 스텝만 동시성 8로 남아 있어 2026-09-03~09-04
    # 4회 연속 전체 실패했다). 재무제표 스텝의 대상 건수(6,500여 건)가 현금흐름/부채
    # 스텝보다 많아 처리 시간이 더 길 것으로 예상돼 여유를 한 번 더 늘린다.
    timeout-minutes: 480
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill DART fundamentals
        run: npm run backfill:stock-annual-fundamentals
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Backfill DART cashflow/debt
        run: npm run backfill:dart-cashflow-debt
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Backfill stock industry classification
        run: npm run backfill:stock-industry-classification
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
