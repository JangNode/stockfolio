      # 연구 DS6 포워드 관찰(시험 아님, 시험 번호 273 유지). 1) 고정 스냅샷으로 기록값 재확인 2) 통과하면 라이브 2026 파일(캐시와 다른 2025·2026만 다운로드 허용)로 관찰 구간 로그 갱신. 새 Actions 캐시 항목은 만들지 않는다.
      - name: 연구 진단 DS6 우위 분해 (시험 아님, 번호 275 유지, 읽기 전용, 외부 요청 0건, Storage 읽기 월말 목록 약 0.2 MiB)
