name: Verify US Stock Quotes (temp)

# [검증용 임시 워크플로] 미국주식 API 응답 필드를 실제 KIS 계정으로 스팟체크한다.
# DB에 스크리닝 데이터를 쓰지 않는 읽기 전용 검증이라 workflow_dispatch로만 수동 실행한다.
# 검증 끝나면 이 파일과 scripts/verify-us-quotes.ts, package.json의 verify:us-quotes를 지운다.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify US stock quote API responses
        run: npm run verify:us-quotes
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
