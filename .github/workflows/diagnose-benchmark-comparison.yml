name: 장기 백테스트 벤치마크 비교 진단 (1회성)

# "장기 백테스트" 벤치마크 비교 조사(2026-09-29)용. scripts/compute-strategy-
# backtest-summary.ts와 동일한 유니버스/백테스트 엔진으로 전략별 시장참여비율·
# 평균 보유종목수, 유니버스 동일가중 벤치마크(buy-and-hold/월간 리밸런싱), 코스피/
# 코스닥 지수의 CAGR/MDD/연도별 수익률을 계산해 콘솔에 출력한다. 순수 조회 +
# 계산 진단(쓰기 없음). 계산 대상과 비슷한 규모라 production 배치와 동일하게
# 시간 여유를 둔다. 확인 끝나면 이 워크플로와 대응 스크립트
# (scripts/diagnose-benchmark-comparison.ts)는 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose benchmark comparison
        run: npm run diagnose:benchmark-comparison
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
