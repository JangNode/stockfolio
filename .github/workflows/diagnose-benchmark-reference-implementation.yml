name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# scripts/diagnose-benchmark-reference-implementation.ts는 lib/benchmarkSummary.ts의
# 유니버스 동일가중 월간 리밸런싱 계산을 원자료에서 독립적으로 재구현한 참조
# 스크립트다(2026-09-29 CAGR/MDD 불일치 조사, 재현 가능성을 위해 영구 보존 —
# 이 스크립트 자체는 정리 대상이 아니다). 이 워크플로는 필요할 때 수동으로
# 다시 돌려 프로덕션 DB 값(benchmark_summary)과 교차검증하는 용도다. 순수
# 조회+계산(쓰기 없음).
on:
  workflow_dispatch:
    inputs:
      which:
        description: "실행 선택: vflow(연구 D5용 외국인 순매수 부분집합 구축: 수급 정리본 한 번 읽기, Actions 캐시 저장), vgt(연구 D·T 시도 242~247 시험, 고정 스냅샷+보조 파일+수급 부분집합 캐시만 읽음), vohlc(연구 D·T 0단계: 하네스 시가·고가·저가·거래대금 확장 검증, 읽기 전용, 고정 스냅샷), pdoc(공개 문서 페이지 5곳의 본문 앞부분을 읽어 출력, API 호출 아님, 키 없음), pflow(수급 정리본이 가격 스냅샷 달력의 몇 %를 덮는지·채우기 호출 수 추정, 읽기 전용, 고정 스냅샷+Storage 정리본 약 18 MiB), pclean(연구 PEAD 전용 Actions 캐시·아티팩트 목록/삭제, only=list|delete), pinv(Supabase 연구 객체·수급 현황 읽기 전용, only=list|db|read), riskdiag(연구 진단: 위험 수준을 맞춘 069500 대비 성과 비교, 시험 아님, 기존 일별 순수익 캐시+069500 보조 파일만, Supabase 접속 없음), ds56(연구 DS5·DS6 공시 미사용 DS4 변형 시험 또는 only=repro이면 재현·자체 점검만, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), ds4fwd(연구 진단 DS4 후속, 시험 아님, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), ds4(연구 DS4 코어 40% + PE4 20% 상한 위성 시험 또는 only=repro이면 재현·자체 점검만, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), dsat(연구 DS 지연 둔감 코어-위성 DS1~DS3 시험 또는 only=repro이면 재현·자체 점검만, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), csdelay(연구 진단 코어-위성 하루 지연 민감도 분해, 시험 아님, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), csat(연구 CS 코어-위성 CS1~CS3 시험 또는 only=repro이면 재현·코어 구조 점검만, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), semidiag(연구 진단: 삼성전자·SK하이닉스 기여 분해, 시험 아님, 기존 캐시+고정 스냅샷+069500 보조 파일만, Storage 읽기 0), kssstatus(KODEX 신호 상태 읽기 전용 확인: cron.job_run_details·net._http_response·kodex_sector_signals·schedule_scrape_status SELECT만), ivalloc(연구 IVA 변동성 역수 배분 R1~R3 시험 또는 only=repro이면 구성요소·P2 재현만, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수+일별 순수익 캐시, Storage 읽기 0), recycle(연구 CAPREC 자본 재활용 배분 Q1~Q3 시험 또는 only=repro이면 구성요소·P2 재현·PE4 분해 저장만, Storage 읽기 0), alloc(연구 전략 배분 P1~P3 시험 또는 only=repro이면 구성요소 재현·일별 수익 저장만, 고정 스냅샷+보조 파일+PE4 입력 캐시+저장된 WFR 점수, Storage 읽기 0), pe4sub(연구 전략 배분 P1~P3용 PE4 입력 부분집합: fin·filings·월말 목록 한 번 읽어 삭제 대상이 아닌 새 이름의 Actions 캐시로 구축), psub(연구 PEAD 잠정실적 PE7 0단계: fin·filings·월말 목록 한 번 읽어 부분집합 캐시 구축), pcol(PE7 잠정실적 공정공시 대량 수집+품질 점검, DART 연구용 키만, 시험 없음; pilot=1이면 표본 파일럿), pead7(PE7 시험 1회, 부분집합+파싱 결과+고정 스냅샷+보조 파일만 읽음, Storage 읽기 0), dart, kis, verify, test, q, q2fill, q2, rprobe, rfin, rverify, mm(월말 시장 구분 이어받기, 평일 15:40 KST 이후만), apre(연구 A 사전 점검, 읽기 전용), pname(우선주 쌍 종목명 대조, KRX 최대 40건, 14:00~15:40 KST 금지), c(연구 C 점검+시험, 읽기 전용), l(연구 L 대형주 집중 시험), ls(연구 LS trailing stop 시험), lm(연구 LM 모멘텀 로테이션 시험), rg(연구 RG 국면 필터 시험), snap(연구용 가격 Parquet 스냅샷 점검·고정 저장, 읽기 전용), le(연구 LE 모멘텀 앙상블 시험, 고정 스냅샷만 읽음), lv(연구 LV LE2+변동성 목표화 시험, 고정 스냅샷만 읽음), am(연구 AM LE2+절대 모멘텀 청산 시험, 고정 스냅샷만 읽음), lw(연구 LW 앙상블 모멘텀 종목 수 확대 시험, 고정 스냅샷만 읽음), mdd(MDD 해부 진단, 시험 아님, 고정 스냅샷만 읽음), aux(연구 LC 0단계: 069500 원주가 보조 파일 구축, KRX 소량, KST 14:00~15:40 금지), lc(연구 LC 변동성 목표화+절대 모멘텀 청산 시험, 고정 스냅샷+보조 파일만 읽음), prelim2(연구 PEAD 잠정실적 파일럿 2차: 정기보고서 대조·시각 문맥·코스닥 3건, DART 연구용 키만, Storage 읽기 0), prelim(연구 PEAD 잠정실적 공정공시 점검+파일럿, 시험 아님, DART 연구용 키만, 호출 150건 이내), pead3(연구 PEAD 보유 단축·진입 차단 PE4~PE6 시험; only=NONE이면 기준선 표만), pead2(연구 PEAD 2단계 PE1~PE3 시험, 고정 스냅샷+보조 파일+R 재무 Storage 읽기; only=NONE이면 기준선 표만), pead1(연구 PEAD 1단계 가능성 점검, 시험 아님, 고정 스냅샷+R 재무 Storage 읽기), a(연구 A 시험), b(연구 B 시험) 또는 r, pre17(연구 DS6 2011~2016 독립 구간 시험 272: 읽기 전용, only=repro이면 가용성·재현·자체 점검만, DART 호출 0, 외부 요청 0건, Storage 읽기 0), ds6fu(연구 DS6 후속 진단: 15년 연속·롤링 3년·하루 지연 분해·삼성전자 분해, 시험 아님 번호 소진 없음, DART 호출 0, 외부 요청 0건, Storage 읽기 0), ds7(연구 DS7 시도 273: DS6 + 계좌 전체 노출 배율, 읽기 전용, 1회, only=repro이면 재현·DS6 일관성·배율 구조 점검만, DART 호출 0, 외부 요청 0건, Storage 읽기 0), ds6reg(연구 진단 DS6 우위 분해: 연도별 대장주 우위·환경별·코어 쏠림, 시험 아님 번호 275 유지, 고정 스냅샷+보조 파일+일별 순수익 캐시, DART 호출 0, 외부 요청 0건), ds89(연구 DS8 시도 274·DS9 시도 275: only=repro이면 재현·구조 자체 점검만(DS8·DS9 성과 미계산), only=ds8|ds9이면 해당 후보 1회 시험, 고정 스냅샷+보조 파일+일별 순수익 캐시, DART 호출 0, 외부 요청 0건), ds6fwd(연구 DS6 포워드 관찰, 시험 아님 번호 273 유지: 고정 스냅샷으로 기록값 재확인 뒤 2026-10-26 이후 DS6 대 069500 일별 로그 갱신. 캐시 적중이면 2026 파일(약 14 MiB)만 받고 069500 신규 거래일만 KRX 호출, KST 14:00~15:40 금지, DART 호출 0, DB 쓰기 0)"
        required: false
        default: "dart"
      only:
        description: "which=test: 이번 차수에 실행할 후보(쉼표 구분, 예 P3,P4)"
        required: false
        default: ""
      before:
        description: "which=test: 이전 차수까지 실행한 시험 개수"
        required: false
        default: "0"
      pilot:
        description: "N 수집 파일럿(1이면 저장 없이 소규모 검증)"
        required: false
        default: "0"
      refetch:
        description: "which=rfin: 1이면 수정(oi-name-v1: 영업이익(손실) 변형 + 2026 사업연도 추가) 뒤 영업이익이 빈 묶음과 새 사업연도 묶음만 받는다(목록·업종 제외, fin.parquet만 올림)"
        required: false
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # pclean(연구 PEAD 전용 Actions 캐시·아티팩트 삭제)이 actions: write를 쓴다. 다른 which에서는 쓰지 않는다.
    permissions:
      contents: read
      actions: write
    env:
      # 연도별 Parquet 가격 파일을 실행마다 다시 받지 않도록 디스크 캐시를 쓴다(lib/parquetDiskCache.ts).
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        id: parquet_restore
        if: ${{ inputs.which != 'snap' && inputs.which != 'le' && inputs.which != 'lv' && inputs.which != 'am' && inputs.which != 'lw' && inputs.which != 'mdd' && inputs.which != 'aux' && inputs.which != 'lc' && inputs.which != 'pead1' && inputs.which != 'pead2' && inputs.which != 'pead3' && inputs.which != 'prelim' && inputs.which != 'prelim2' && inputs.which != 'psub' && inputs.which != 'pe4sub' && inputs.which != 'pcol' && inputs.which != 'pead7' && inputs.which != 'pclean' && inputs.which != 'pinv' && inputs.which != 'pflow' && inputs.which != 'pdoc' && inputs.which != 'vohlc' && inputs.which != 'vtv' && inputs.which != 'wfrprep' && inputs.which != 'wfr' && inputs.which != 'wfrsim' && inputs.which != 'kssverify' && inputs.which != 'ksspre' && inputs.which != 'kssreg' && inputs.which != 'lowprep' && inputs.which != 'lowturn' && inputs.which != 'alloc' && inputs.which != 'recycle' && inputs.which != 'riskdiag' && inputs.which != 'ivalloc' && inputs.which != 'semidiag' && inputs.which != 'csat' && inputs.which != 'csdelay' && inputs.which != 'dsat' && inputs.which != 'ds4' && inputs.which != 'ds4fwd' && inputs.which != 'ds56' && inputs.which != 'pre17' && inputs.which != 'ds6fu' && inputs.which != 'ds7' && inputs.which != 'ds6fwd' && inputs.which != 'ds89' && inputs.which != 'ds6reg' && inputs.which != 'kssstatus' && inputs.which != 'vflow' && inputs.which != 'vgt' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      # 연구 LE~: 고정 스냅샷(데이터 종료일 2026-10-26)만 읽는다. 일일 갱신으로 parquet-v1-* 키가 바뀌어도 영향이 없고, 스냅샷이 없으면 복원 실패 -> gate 차단.
      - name: Restore 고정 스냅샷 (연구 LE~)
        id: snap_use
        if: ${{ inputs.which == 'le' || inputs.which == 'lv' || inputs.which == 'am' || inputs.which == 'lw' || inputs.which == 'mdd' || inputs.which == 'lc' || inputs.which == 'pead1' || inputs.which == 'pead2' || inputs.which == 'pead3' || inputs.which == 'prelim' || inputs.which == 'prelim2' || inputs.which == 'psub' || inputs.which == 'pe4sub' || inputs.which == 'pcol' || inputs.which == 'pead7' || inputs.which == 'pflow' || inputs.which == 'vohlc' || inputs.which == 'vtv' || inputs.which == 'wfrprep' || inputs.which == 'wfr' || inputs.which == 'wfrsim' || inputs.which == 'lowturn' || inputs.which == 'alloc' || inputs.which == 'recycle' || inputs.which == 'ivalloc' || inputs.which == 'semidiag' || inputs.which == 'csat' || inputs.which == 'csdelay' || inputs.which == 'dsat' || inputs.which == 'ds4' || inputs.which == 'ds4fwd' || inputs.which == 'ds56' || inputs.which == 'pre17' || inputs.which == 'ds6fu' || inputs.which == 'ds7' || inputs.which == 'ds89' || inputs.which == 'ds6reg' || inputs.which == 'ds6fwd' || inputs.which == 'vgt' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-snapshot-20261026
          fail-on-cache-miss: true

      # 스냅샷 만들기: 연구 RG 실행(run 40435189636)이 저장한 연구 브랜치 캐시를 정확한 키로 복원해 고정 키로 다시 저장한다(Supabase Storage 다운로드 0).
      - name: Restore 스냅샷 원본 캐시 (RG 실행 40435189636)
        id: snap_src
        if: ${{ inputs.which == 'snap' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-40435189636-1
          fail-on-cache-miss: true

      - name: Reset Parquet cache dirty marker
        run: rm -f .parquet-cache/.dirty

      - name: Parquet cache gate (캐시 적중이 아니면 연구를 실행하지 않는다)
        id: parquet_gate
        env:
          MATCHED_KEY: ${{ steps.parquet_restore.outputs.cache-matched-key || steps.snap_use.outputs.cache-matched-key || steps.snap_src.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.parquet_restore.outputs.cache-hit || steps.snap_use.outputs.cache-hit || steps.snap_src.outputs.cache-hit }}
          # 2010~2026 중 여기 적은 연도만 캐시에 없어도 통과한다(공백 구분). 비워 두면 17개 파일(2010~2026)이 전부 캐시에 있어야 통과한다(엄격).
          ALLOWED_MISSING_YEARS: ""
        run: |
          echo "cache-matched-key=${MATCHED_KEY:-없음} exact-hit=${EXACT_HIT:-없음}"
          ls -la .parquet-cache 2>/dev/null | head -50 || true
          missing=""
          for y in $(seq 2010 2026); do
            if [ ! -f ".parquet-cache/$y.parquet" ] || [ ! -f ".parquet-cache/$y.parquet.meta.json" ]; then missing="$missing $y"; fi
          done
          echo "캐시에 없는 연도:${missing:- 없음}"
          blocked=false
          if [ -z "$MATCHED_KEY" ]; then blocked=true; fi
          for y in $missing; do
            case " $ALLOWED_MISSING_YEARS " in *" $y "*) ;; *) blocked=true ;; esac
          done
          if [ "$blocked" = "true" ]; then
            echo "gate=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::캐시가 적중이 아니라(복원 실패 또는 연도 파일 누락) 연구 스크립트를 실행하지 않습니다. 결과를 보고하고 지시를 받으세요."
          else
            echo "gate=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: N 단계 1 DART 수집 (Storage Parquet만 쓰기)
