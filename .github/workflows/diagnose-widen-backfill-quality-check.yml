name: 전종목 확장 재백필 소형주 품질 확인 (진단, 1회성)

# 임시(임시 브랜치 전용, 병합 금지): 시장 국면 pg_cron 등록(병합된 main의 docs/market-regime/pg_cron_register.sql을 한 번 실행)과 읽기 전용 검증.
# 이 워크플로는 trigger_market_regime_dispatch()를 호출하지 않는다(dispatch·테스트 호출 금지).
on:
  workflow_dispatch:
    inputs:
      years:
        description: "미사용(기존 입력 유지)"
        type: string
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (merged SQL)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register pg_cron job from merged SQL (once) and verify read-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp/database/query"
          SQL_FILE=docs/market-regime/pg_cron_register.sql
          echo "main commit: $(git rev-parse HEAD)"
          sha256sum "$SQL_FILE"
          grep -n "'0 1 \* \* 1-5'" "$SQL_FILE"
          grep -c "trigger_market_regime_dispatch();" "$SQL_FILE" || true
          echo "--- 등록 SQL 실행(1회)"
          jq -n --rawfile q "$SQL_FILE" '{query: $q}' | curl -sS -X POST "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- -w "\nHTTP %{http_code}\n"

          Q() { jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-; }
          P() { echo "--- $1"; Q "$2" | jq -c 'if type=="array" then .[] else . end'; }

          P "cron.job: market_regime 항목" "select jobid, jobname, schedule, active, command, database, username from cron.job where jobname = 'trigger-market-regime'"
          P "cron.job 전체 개수" "select count(*) as jobs, count(*) filter (where active) as active_jobs from cron.job"
          P "cron.timezone" "select current_setting('cron.timezone', true) as cron_timezone"
          P "함수 ACL(proacl)과 보안 정의" "select p.proname, p.prosecdef as security_definer, p.proconfig, p.proacl::text as acl from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname in ('trigger_market_regime_dispatch', 'market_regime_should_dispatch') order by p.proname"
          P "anon/authenticated 실행 권한(false여야 함)" "select r.rolname, has_function_privilege(r.rolname, 'public.trigger_market_regime_dispatch()', 'execute') as can_dispatch, has_function_privilege(r.rolname, 'public.market_regime_should_dispatch(date)', 'execute') as can_check from pg_roles r where r.rolname in ('anon', 'authenticated', 'service_role', 'postgres') order by r.rolname"
          P "routine_privileges(grantee 목록)" "select routine_name, grantee, privilege_type from information_schema.routine_privileges where routine_schema = 'public' and routine_name in ('trigger_market_regime_dispatch', 'market_regime_should_dispatch') order by routine_name, grantee"
          P "휴장일 판정(SQL만, dispatch 호출 없음)" "select d::text as date, to_char(d, 'Dy') as dow, c.is_open as calendar_is_open, public.market_regime_should_dispatch(d) as should_dispatch from unnest(array['2026-10-26','2026-10-27','2026-10-28','2026-11-02','2026-12-24','2026-12-25','2026-12-26','2026-12-31','2027-01-01','2027-02-08','2027-02-10','2030-01-02']::date[]) as d left join public.krx_trading_calendar c on c.trade_date = d order by d"
          P "오늘(KST) 판정" "select (now() at time zone 'Asia/Seoul')::date::text as today_kst, public.market_regime_should_dispatch((now() at time zone 'Asia/Seoul')::date) as should_dispatch"
          P "등록 직후 해당 job의 실행 기록(없어야 함)" "select count(*) as runs from cron.job_run_details d join cron.job j on j.jobid = d.jobid where j.jobname = 'trigger-market-regime'"
