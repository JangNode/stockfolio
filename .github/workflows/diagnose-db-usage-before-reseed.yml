name: Postgres DB 사용량 확인 - hot table 재시딩 전 (진단, 1회성)

# stock_daily_prices_recent 재시딩(scripts/seed-stock-daily-prices-recent.ts 재실행)
# 전 DB 실사용량을 확인한다. 읽기 전용 SQL만 실행(SET default_transaction_read_only
# on으로 이중 안전장치). 확인 끝나면 이 워크플로와
# scripts/diagnose-db-usage-before-reseed.sql을 정리 PR로 제거한다.
#
# db.<ref>.supabase.co의 direct connection은 GitHub Actions 러너에서 IPv6로만
# 붙는데(2026-09-30 실측, "Network is unreachable"), 러너가 IPv6 라우팅이 안 되는
# 경우가 있어 Session Pooler(IPv4)로 접속한다. 풀러 리전은 Supabase Management API로
# 조회한다(supabase-migrate.yml과 동일한 SUPABASE_ACCESS_TOKEN 재사용).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve pooler region via Supabase Management API
        id: region
        run: |
          region=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/yxknesiiwhtjpgbwvggp" | \
            node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).region')
          echo "region=$region"
          echo "region=$region" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run read-only diagnostic SQL (via Session Pooler, IPv4)
        run: |
          psql "postgresql://postgres.yxknesiiwhtjpgbwvggp:${SUPABASE_DB_PASSWORD}@aws-0-${REGION}.pooler.supabase.com:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/diagnose-db-usage-before-reseed.sql
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REGION: ${{ steps.region.outputs.region }}
