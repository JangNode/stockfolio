name: 벤치마크 참조 구현 재실행 (검증, 영구 보존)

# 임시: 병합 스크립트 --apply 1회 실행용(PR 전에 되돌린다). 외부 요청 없음. 삽입 키 JSON을 브랜치에 커밋한다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      - name: Merge fundamentals (--apply, 1회)
        run: npx tsx --conditions=react-server scripts/merge-fundamentals-into-stock-annual.ts --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit applied keys JSON
        if: ${{ always() }}
        run: |
          if [ -f docs/peg-fundamentals-merge-applied-keys.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/peg-fundamentals-merge-applied-keys.json
            git commit -m "data: 병합 적용 삽입 키 목록(되돌리기용)"
            git push origin HEAD:claude/peg-fundamentals-merge
          fi
