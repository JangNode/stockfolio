name: KIS 국내휴장일조회 응답 구조 확인 (진단, 1회성)

# 한국거래소(KRX) 거래일 캘린더 도입 전, KIS chk-holiday API의 실제 응답 필드명과
# 커버 범위를 확인한다. 순수 조회(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-kis-holiday-check.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose KIS holiday check response
        run: npm run diagnose:kis-holiday-check
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
