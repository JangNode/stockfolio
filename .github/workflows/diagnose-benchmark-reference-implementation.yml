      - name: 연구 진단 DS4 후속(연도별 초과·코어 제외판·구성요소 단독·학습 구간 요인 분해; 시험 아님, 번호 소진 없음, 기존 캐시·고정 스냅샷·069500 보조 파일만, 외부 요청 0건, Storage 읽기 0)
