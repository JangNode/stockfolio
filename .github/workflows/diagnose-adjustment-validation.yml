name: 조정계수 검증 진단(임시)

# 디스포저블 — 워크스트림이 끝나면 정리 PR로 제거한다(RULES.md 11번).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true면 가짜 청산 행을 정정한다(기본 false=계획 출력만)."
        type: string
        default: "false"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose
        run: npm run experiment:strategy-variants
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          CORRECT_APPLY: ${{ inputs.apply }}
      - name: Upload correction backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-backup
          path: correction-backup.json
          if-no-files-found: ignore
