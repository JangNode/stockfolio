name: 수정주가 오염 규모 진단 (진단, 1회성)

# 저장된 국내 시세가 수정주가 없이 원가로 저장돼 있는 문제의 오염 규모를 측정한다.
# 순수 조회+계산(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-price-adjustment-contamination.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose price adjustment contamination
        run: npm run diagnose:price-adjustment-contamination
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
