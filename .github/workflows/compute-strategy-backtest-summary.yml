name: Strategy Backtest Summary

# "전략 관리" 탭의 "장기 백테스트(2016~오늘)" 섹션 캐시(전략 5종 + 벤치마크
# 3종: 코스피/코스닥/유니버스 월간 리밸런싱)를 매주 한 번 재계산한다.
# 몇 시간 밀려도 무방한 정적 재계산이라(다음 주 실행에서 자동으로 최신 데이터를
# 다시 반영) GitHub Actions의 schedule 트리거를 그대로 쓴다(SKILLS.md 배치
# 스케줄링 방식 선택 참고) — pg_cron을 거칠 필요가 없다.
#
# 벤치마크 계산이 코스피/코스닥 지수 시세(beta_price_history)를 쓰므로, 이 배치가
# 매번 최신 지수로 계산하도록 "Compute strategy backtest summary" 스텝 앞에 지수
# 백필을 먼저 돌린다(계산 시점 지수가 최대 몇 달 묵어 있던 문제, 2026-09-29 조사로
# 확인). .github/workflows/calc-stock-beta.yml의 분기 1회 지수 백필과 중복
# 실행되지만 멱등적이라 해롭지 않다.
on:
  schedule:
    # 매주 월요일 한국시간(KST) 05:00 = UTC 일요일 20:00. 스크리닝/AI 모의투자
    # 배치(.github/workflows/screening.yml 등)와 시간대가 겹치지 않게 잡았다.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      data_widen_stage:
        description: "저장할 data_widen_stage 값(비우면 'pit_adjusted' — 화면 미노출. 팀장 확인 후 'full'로 올림)."
        type: string
        default: ""
      universe_min_market_cap_eok:
        description: "양수면 그날(as-of) 시총(억) 이상만 편입하는 시총 유니버스 실험(기본 비움=기존 유니버스). data_widen_stage는 반드시 별도 값으로 지정."
        type: string
        default: ""
      cost_free_dry_run:
        description: "true면 거래비용을 끄고 계산만 하고 DB에는 저장하지 않는다(전략 자체의 우위 확인용 검증 실행)."
        type: string
        default: "false"

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update index prices
        run: npm run backfill:index-daily-prices
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 장기 백테스트가 Parquet만 읽으므로(hot 표 미사용), 현재 연도 파일에 빠진 최근
      # 거래일을 계산 직전에 채운다. 기존 행은 보존하고 없는 날짜만 받는다(전년도는 연초
      # 공백 보정용). 일일 갱신 배치는 hot 표만 갱신하므로 Parquet는 이 스텝이 유일한 갱신.
      - name: Refresh current-year price parquet
        run: |
          export BACKFILL_YEAR_RANGE_START=$(( $(date -u +%Y) - 1 ))
          export BACKFILL_YEAR_RANGE_END=$(date -u +%Y)
          npm run backfill:stock-daily-prices
        env:
          SKIP_EXISTING_DATES: "true"
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 새로 생긴 분할·병합 이벤트를 배치 직전에 탐지·저장한다(신뢰도 높은 것만 배치가 적용).
      - name: Scan price adjustment events
        run: npm run scan:price-adjustment-events
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Compute strategy backtest summary
        run: npm run batch:strategy-backtest-summary
        env:
          DATA_WIDEN_STAGE: ${{ inputs.data_widen_stage }}
          COST_FREE_DRY_RUN: ${{ inputs.cost_free_dry_run }}
          UNIVERSE_MIN_MARKET_CAP_EOK: ${{ inputs.universe_min_market_cap_eok }}
          # 전종목(수천 개) 시점별 유니버스라 Node 기본 힙(약 4GB)으로는 부족할 수 있어 넉넉히 준다.
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
