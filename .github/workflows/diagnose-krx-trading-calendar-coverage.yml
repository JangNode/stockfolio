name: KRX 거래일 캘린더 수집 결과 확인 (진단, 1회성)

# 첫 실동기화(sync-krx-trading-calendar.yml) 이후, 24일 단위 체이닝 수집에
# 날짜 공백이 없는지와 연도별 개장일수가 상식 범위인지 실제 DB에서 확인한다.
# 순수 조회(쓰기 없음). 확인 끝나면 이 워크플로와
# scripts/diagnose-krx-trading-calendar-coverage.ts를 정리 PR로 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose KRX trading calendar coverage
        run: npm run diagnose:krx-trading-calendar-coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
