name: hot table 필터 복원 실동작 확인 (진단, 1회성)

# #423(hot table 시가총액 하한 필터 복원)이 오늘 14:30 KST 스크리닝 배치
# 실행에서 실제로 작동했는지 확인한다. 쓰기 없음(순수 조회). 확인 끝나면 이
# 워크플로와 scripts/diagnose-hot-table-filter-revert-verify.ts를 정리 PR로
# 제거한다.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose hot table filter revert
        run: npm run diagnose:hot-table-filter-revert-verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
