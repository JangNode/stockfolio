name: 전종목 확장 재백필 소형주 품질 확인 (진단, 1회성)

# 2015~2026 확장 재백필 각 단계 후 소형주 데이터 품질 확인용. 순수 조회 진단(쓰기
# 없음). 확인 끝나면 이 워크플로와 scripts/diagnose-widen-backfill-quality-check.ts를
# 정리 PR로 제거한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "확인할 연도(쉼표 구분, 최근->과거 순, 예: 2024,2025,2026)"
        type: string
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 연도별 Parquet 가격 파일을 실행마다 다시 받지 않도록 디스크 캐시를 쓴다(lib/parquetDiskCache.ts).
      PARQUET_CACHE_DIR: ${{ github.workspace }}/.parquet-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Parquet cache
        uses: actions/cache/restore@v4
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            parquet-v1-${{ runner.os }}-

      - name: Reset Parquet cache dirty marker
        run: rm -f .parquet-cache/.dirty

      - name: Diagnose widen backfill small-cap quality
        run: npm run diagnose:widen-backfill-quality-check
        env:
          YEARS: ${{ inputs.years }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check Parquet cache changes
        id: parquet_cache_state
        if: ${{ always() }}
        run: |
          if [ -f .parquet-cache/.dirty ]; then echo "dirty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Parquet cache
        if: ${{ always() && steps.parquet_cache_state.outputs.dirty == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .parquet-cache
          key: parquet-v1-${{ runner.os }}-${{ github.run_id }}
