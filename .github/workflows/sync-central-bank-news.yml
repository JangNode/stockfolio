name: Central Bank News Sync

# FOMC/한국은행 관련 뉴스를 연준·한국은행 공식 RSS에서 매일 한국시간(KST)
# 오전 7시(미국 정규장 마감 이후 — 전날 밤~새벽 뉴스가 전부 반영된 시점)에
# 수집해 DB에 반영한다. 화면 표시 전용이라 실시간성이 필요 없고(매매 판단에
# 미연동, FOMC/금통위 발표 직후 감지는 Rate Announcement Check가 백오프로
# 전담), 2026-09-11 20분 간격 → 하루 1회로 줄였다(GitHub Actions 무료 실행
# 시간의 최대 소비처였음). pg_cron 트리거는 그 이전(20분 간격이던 시절)부터
# 쓰던 방식을 그대로 유지한다(supabase/migrations/
# 20260830130000_create_central_bank_news.sql, 스케줄 변경은
# 20260911000000_reduce_central_bank_news_sync_interval.sql).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync central bank news
        run: npx tsx --conditions=react-server scripts/sync-central-bank-news.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
